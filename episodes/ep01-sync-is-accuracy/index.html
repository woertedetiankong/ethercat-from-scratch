const rgba = (hex,a) => { const n = parseInt(hex.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; };

/* ---------- drawing primitives ---------- */
function text(s,x,y,o={}){
  ctx.save(); ctx.globalAlpha *= (o.alpha ?? 1);
  ctx.font = `${o.weight||500} ${o.size||28}px ${o.font||F.sans}`;
  ctx.fillStyle = o.color || C.ink; ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'middle';
  if (o.ls) ctx.letterSpacing = o.ls + 'px';
  if (o.shadow){ ctx.shadowColor = o.shadow; ctx.shadowBlur = 24; }

}
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }
function glow(x,y,r,color,a=1){ const g = ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0, rgba(color,.5*a)); g.addColorStop(1, rgba(color,0)); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }

  if (o.label) text(o.label, q.x, q.y - r - 22, {size:o.ls||24, font:F.mono, weight:700, color});

}
function burst(x,y,k,color=C.red){ // k in 0..1

  ctx.save(); ctx.globalAlpha *= 1-k;
  ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x,y,14+60*eo(k),0,Math.PI*2); ctx.stroke();
  const s = 16; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x-s,y-s); ctx.lineTo(x+s,y+s); ctx.moveTo(x+s,y-s); ctx.lineTo(x-s,y+s); ctx.stroke();

}
function cross(x,y,s,color,lw=7,a=1){ ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x-s,y-s); ctx.lineTo(x+s,y+s); ctx.moveTo(x+s,y-s); ctx.lineTo(x-s,y+s); ctx.stroke(); ctx.restore(); }
function check(x,y,s,color,a=1){ ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = color; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(x-s,y); ctx.lineTo(x-s*.3,y+s*.7); ctx.lineTo(x+s,y-s*.6); ctx.stroke(); ctx.restore(); }
function ringArc(x,y,r,frac,color,lw=6,a=1){ ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = rgba(color,.18); ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke(); ctx.strokeStyle = color; ctx.lineCap='round'; ctx.beginPath(); ctx.arc(x,y,r,-Math.PI/2,-Math.PI/2 + Math.PI*2*clamp(frac,0,1)); ctx.stroke(); ctx.restore(); }
function pulse(x,y,k,color,r0=40,r1=120){ if (k<=0||k>=1) return; ctx.save(); ctx.globalAlpha *= (1-k); ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(x,y,lerp(r0,r1,eo(k)),0,Math.PI*2); ctx.stroke(); ctx.restore(); }
function tag(s,x,y,color,o={}){
  ctx.save(); ctx.globalAlpha *= (o.alpha ?? 1);

function server(x,y,w,h,o={}){

function user(x,y,a=1,color=C.dim){
  ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x,y-16,15,0,Math.PI*2); ctx.fill();

}
function hexagon(x,y,r,a=1){
  ctx.save(); ctx.globalAlpha *= a; glow(x,y,r*2.2,C.gold,.3);
  ctx.beginPath(); for (let i=0;i<6;i++){ const an = Math.PI/6 + i*Math.PI/3; const px = x + r*Math.cos(an), py = y + r*Math.sin(an); i ? ctx.lineTo(px,py) : ctx.moveTo(px,py); } ctx.closePath();

  for (let i=-1;i<=1;i++){ ctx.beginPath(); ctx.moveTo(x-r*.35, y); ctx.lineTo(x+r*.35, y+i*r*.35); ctx.stroke(); }

}
function nodeCircle(x,y,r,o={}){
  const role = o.role || 'follower', a = o.alpha ?? 1;
  const col = role==='leader' ? C.gold : role==='candidate' ? C.coral : role==='dead' ? C.red : C.sky;
  ctx.save(); ctx.globalAlpha *= a;
  if (role !== 'dead') glow(x,y,r*2.1,col, role==='follower'?.25:.55);
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle = role==='dead' ? '#241722' : role==='leader' ? mixHex(C.panel2,C.gold,.22) : C.panel2; ctx.fill();
  ctx.lineWidth = role==='follower' ? 3 : 5; ctx.strokeStyle = rgba(col, role==='dead'?.6:1); ctx.stroke();

function wrapLines(s, maxW){ const words = s.split(' '), out = []; let cur = ''; for (const w of words){ const t = cur ? cur+' '+w : w; if (ctx.measureText(t).width > maxW && cur){ out.push(cur); cur = w; } else cur = t; } if (cur) out.push(cur); return out; }

/* ---------- background ---------- */
function background(t){
  ctx.fillStyle = C.bg; ctx.fillRect(0,0,W,H);
  const g = ctx.createRadialGradient(960,480,80,960,480,1150); g.addColorStop(0, C.bg2); g.addColorStop(1, rgba(C.bg,0)); ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = rgba(C.faint,.35); const off = (t*6)%48;
  for (let x = 24; x < W; x += 48) for (let y = 24 + off; y < H; y += 48) ctx.fillRect(x, y, 2, 2);
  const v = ctx.createRadialGradient(960,540,500,960,540,1250); v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.55)'); ctx.fillStyle = v; ctx.fillRect(0,0,W,H);
}

/* ---------- more primitives: panels, files, disks, arrows, chips ---------- */
function panel(x,y,w,h,o={}){ ctx.save(); ctx.globalAlpha *= (o.alpha ?? 1); rr(x-w/2,y-h/2,w,h,o.r||14); ctx.fillStyle = o.fill || C.panel; ctx.fill(); ctx.lineWidth = o.lw || 2; ctx.strokeStyle = o.edge || C.line; if (o.dash) ctx.setLineDash(o.dash); ctx.stroke(); ctx.restore(); }

  ctx.beginPath(); ctx.moveTo(x+w/2-f,y-h/2); ctx.lineTo(x+w/2-f,y-h/2+f); ctx.lineTo(x+w/2,y-h/2+f); ctx.stroke();
  if (o.rows){ const n = o.rows, rh = Math.min(30, (h-36)/Math.max(n,1)); for (let k=0;k<n;k++){ const ry = y - h/2 + 22 + k*rh + rh/2, rc = o.rowColors ? o.rowColors[k] : c; rr(x-w/2+16, ry-rh*.22, (w-40)*(.55 + .4*rnd(k*7+(o.seed||0))), rh*.44, 4); ctx.fillStyle = rgba(rc,.75); ctx.fill(); } }
  ctx.restore();

function cylinder(x,y,w,h,o={}){
  const a = o.alpha ?? 1, c = o.color || C.sky, e = w*.16; if (a <= 0) return;

  ctx.beginPath(); ctx.ellipse(x,y-h/2,w/2,e,0,0,Math.PI*2); ctx.fillStyle = mixHex(C.panel2,c,.18); ctx.fill(); ctx.stroke();
  ctx.restore();

function arrow(a,b,color,o={}){

function chip(s,x,y,c,k=1,o={}){ if (k <= 0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); tag(s,0,0,c,{size:o.size||20, alpha:o.alpha ?? 1}); ctx.restore(); }

/* ---------- 3Blue1Brown-style primitives: formulas, joints, plots, gears, code ----------
   eq(parts,cx,y,size,{left,glow,alpha}) parts = [str, color, alpha?, sub?] — colour each symbol by meaning, fade terms in one at a time
   wipe(p,x,y,w,h,fn) reveals whatever fn draws left→right (the 'Write' feel); brace(x1,x2,y,label,color,a) a curly brace with a label
   arm/arcArrow/springArc (rotating links, torques, springs), axes/plot (graphs drawn progressively), gear, codeBox, label2 (English over Chinese)
   ------------------------------------------------------------------------------------------ */
const DEG = Math.PI / 180;
// math-ish font for formulas
const MF = (size, w = 600) => `italic ${w} ${size}px ${F.disp}`;
// parts: [string, color, alpha?, sub?]; drawn left→right, centred on cx (or left-aligned with o.left)
function eq(parts, cx, y, size, o = {}) {
  ctx.save(); ctx.globalAlpha *= (o.alpha ?? 1);
  const wOf = p => { ctx.font = MF(p[3] ? size * .55 : size); return ctx.measureText(p[0]).width; };
  const total = parts.reduce((s, p) => s + wOf(p), 0);
  let x = o.left ? cx : cx - total / 2;
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  for (const p of parts) {
    const w = wOf(p), a = p[2] ?? 1;
    if (a > 0) { ctx.save(); ctx.globalAlpha *= a; ctx.font = MF(p[3] ? size * .55 : size); ctx.fillStyle = p[1];
      if (o.glow && p[1] !== C.dim) { ctx.shadowColor = rgba(p[1], .55); ctx.shadowBlur = 18; }
      ctx.fillText(p[0], x, y + (p[3] ? size * .28 : 0)); ctx.restore(); }
    x += w;
  }
  ctx.restore(); return total;
}
// a joint: pivot at (px,py), link of length L at angle th (radians, CCW from +x, screen y up)
const tip = (px, py, L, th) => ({x: px + L * Math.cos(th), y: py - L * Math.sin(th)});
function arm(px, py, L, th, o = {}) {
  const a = o.alpha ?? 1; if (a <= 0) return;

  if (o.ghost) { ctx.setLineDash([14, 14]); ctx.strokeStyle = rgba(c, .8); ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(e.x, e.y); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = c; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(e.x, e.y, o.mass || 22, 0, Math.PI * 2); ctx.stroke(); ctx.restore(); return; }
  glow((px + e.x) / 2, (py + e.y) / 2, L * .6, c, .25);
  ctx.strokeStyle = c; ctx.lineWidth = o.lw || 18; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(e.x, e.y); ctx.stroke();
  ctx.fillStyle = C.panel2; ctx.strokeStyle = C.ink; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(px, py, 24, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = o.massColor || C.ink; ctx.beginPath(); ctx.arc(e.x, e.y, o.mass || 22, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
// curved arrow along a circle of radius r from angle a0 to a1 (math angles)
function arcArrow(px, py, r, a0, a1, color, o = {}) {

// coil spring drawn along an arc of radius r between angles a0 and a1
function springArc(px, py, r, a0, a1, color, o = {}) {

  const n = 120, coils = Math.max(4, Math.abs(a1 - a0) / DEG / 4), amp = o.amp || 16;
  ctx.save(); ctx.globalAlpha *= al; ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.beginPath();

// axes with origin at (x, y0): width w, half-height h
function axes(x, y0, w, h, o = {}) {
  const a = o.alpha ?? 1; if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = C.dim; ctx.lineWidth = 2.5;
  arrow({x, y: y0 + (o.full ? h : 0)}, {x, y: y0 - h - 10}, C.dim, {lw: 2.5, head: 12});
  arrow({x: x - (o.both ? w : 0), y: y0}, {x: x + w + 10, y: y0}, C.dim, {lw: 2.5, head: 12});
  ctx.restore();
  if (o.xl) text(o.xl, x + w + 10, y0 + 34, {size: 24, font: F.mono, color: C.dim, align: 'right', alpha: a});
  if (o.yl) text(o.yl, x + 14, y0 - h - 10, {size: 26, font: F.mono, color: C.dim, align: 'left', alpha: a});
}
// plot fn(u) for u in [0, prog] mapped to x..x+w; value v ↦ y0 - v*k
function plot(fn, x, y0, w, k, prog, color, o = {}) {
  if (prog <= 0) return null;
  ctx.save(); ctx.globalAlpha *= (o.alpha ?? 1); ctx.strokeStyle = color; ctx.lineWidth = o.lw || 5; ctx.lineJoin = 'round'; ctx.lineCap = 'round';

/* ---------- 4. CANopen ---------- */
SCN.canopen = (lt, b, d) => {
  const busY = 560, mx = 300, dxs = [800, 1150, 1500];
  const a = fade(lt, .2);
  // a CAN bus: one shared line, every node hangs off it
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = C.faint; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(220, busY); ctx.lineTo(1700, busY); ctx.stroke(); ctx.restore();
  text('CAN bus · one shared line  一条共享的总线', 960, busY + 40, {size: 22, color: C.dim, alpha: a});
  box(mx, 380, 230, 120, 'Master', '主站', C.gold, a, {size: 28});
  [[mx, 440]].concat(dxs.map(x => [x, 440])).forEach(([x]) => { ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = C.faint; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x, 440); ctx.lineTo(x, busY); ctx.stroke(); ctx.restore(); });
  const colors = [C.sky, C.violet, C.mint];
  dxs.forEach((x, i) => box(x, 380, 220, 120, 'Drive ' + (i + 1), '驱动器 ' + (i + 1), colors[i], a, {size: 28}));
  // beat 0: one at a time — each drive starts when its own message lands
  const seq = lt < b[2];
  if (seq) dxs.forEach((x, i) => {
    const t0 = b[0] + 1 + i * 1.6;
    packet({x: mx, y: busY}, {x, y: busY}, ramp(lt, t0, t0 + 1), C.gold, {bend: .15});
    if (lt > t0 + 1) { pulse(x, 380, ramp(lt, t0 + 1, t0 + 1.8), colors[i]); text('moves', x, 260, {size: 24, color: colors[i], alpha: fade(lt, t0 + 1)}); }
  });
  if (lt > b[1] && lt < b[2]) {
    chip('skew 偏差: drive 1 moves first', 960, 700, C.gold, eback(ramp(lt, b[1] + .5, b[1] + 1.1)), {size: 24});
  }
  // beat 2..3: targets first, then one SYNC (0x80) to all
  if (lt >= b[2]) {
    dxs.forEach((x, i) => { const t0 = b[2] + .4 + i * .5; packet({x: mx, y: busY}, {x, y: busY}, ramp(lt, t0, t0 + .9), C.gold, {bend: .12, label: 'target'}); });
    const ts = b[2] + 3.5;
    if (lt > ts) {
      const k = ramp(lt, ts, ts + 1.2);
      ctx.save(); ctx.globalAlpha *= (1 - k) * .9; ctx.strokeStyle = C.mint; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(mx, busY); ctx.lineTo(lerp(mx, 1600, eo(k)), busY); ctx.stroke(); ctx.restore();
      chip('SYNC · ID 0x80', mx + 30, 690, C.mint, eback(ramp(lt, ts, ts + .6)) * (1 - ramp(lt, b[4] - .4, b[4])), {size: 24});
      if (lt > ts + 1.1) dxs.forEach((x, i) => pulse(x, 380, ramp(lt, ts + 1.1, ts + 1.9), colors[i]));
    }
  }
  if (lt > b[3] && lt < b[4]) chip('all at once: small skew  一起动：偏差很小', 1150, 700, C.mint, eback(ramp(lt, b[3] + .3, b[3] + .9)), {size: 24});
  // beat 4: the timer that sends SYNC wobbles
  const aT = fade(lt, b[4]);
  if (aT > 0) {
    const wob = Math.sin(lt * 7) * 8 * DEG;
    ringArc(mx, 230, 34, ((lt * .7) % 1), C.coral, 6, aT);
    ctx.save(); ctx.globalAlpha *= aT; ctx.strokeStyle = C.coral; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(mx, 230); ctx.lineTo(mx + 26 * Math.sin(wob + lt * 3), 230 - 26 * Math.cos(wob + lt * 3)); ctx.stroke(); ctx.restore();
    text('software timer  软件定时器', mx + 60, 230, {size: 24, color: C.coral, align: 'left', alpha: aT});
  }
  // beat 5: bus busy — SYNC waits behind a frame in progress
  const aB = fade(lt, b[5], b[7]);
  if (aB > 0) {
    const k = ramp(lt, b[5] + .5, b[5] + 3.5);
    ctx.save(); ctx.globalAlpha *= aB; rr(560, busY - 18, 900 * Math.min(1, k * 1.2), 36, 8); ctx.fillStyle = rgba(C.dim, .5); ctx.fill(); ctx.restore();
    text('a frame in progress: 8 bytes ≈ 0.1 ms at 1 Mbit/s', 1010, busY - 50, {size: 24, color: C.ink, alpha: aB});
    chip('SYNC waits 等待', mx + 130, busY - 50, C.coral, eback(ramp(lt, b[5] + 1, b[5] + 1.6)) * aB, {size: 22});
  }
  // beat 6: each drive adds an interrupt delay
  const aI = fade(lt, b[6], b[7] + 1);
  dxs.forEach((x, i) => { if (aI > 0) chip('+ interrupt 中断', x, 270, C.coral, eback(ramp(lt, b[6] + .3 + i * .3, b[6] + .9 + i * .3)) * aI, {size: 20}); });
  text('each drive adds its own delay  每个驱动器各添一段延迟', 1150, 210, {size: 22, color: C.dim, alpha: aI});
  // beat 7: verdict
  const aV = fade(lt, b[7]);
  card(700, 760, 520, 80, 'skew: fixed ✓  偏差：治了', '', C.mint, aV, {size: 30, tcolor: C.mint});
  card(1250, 760, 560, 80, 'jitter: not fixed ✗  抖动：没治', '', C.coral, aV, {size: 30, tcolor: C.coral});
};

/* ---------- 6. the real run ---------- */
SCN.run = (lt, b, d) => {
  const H0 = D.frame.hist, maxH = Math.max(...H0);
  const gx = 360, gy = 720, gw = 1200, gh = 380, n = H0.length;
  const aH = fade(lt, .2, b[5]);
  // a strip of the first 40 real cycles: where each act landed vs the 1 ms grid
  const aS = fade(lt, .3, b[2]);
  if (aS > 0) {
    let t = 0; const ts = D.frame.strip.slice(0, 16).map(p => (t += p / 1000));
    const span = 16.5;
    for (let i = 1; i <= 16; i++) { const x = gx + i / span * gw; ctx.save(); ctx.globalAlpha *= aS * .5; ctx.setLineDash([5, 7]); ctx.strokeStyle = C.dim; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, 200); ctx.lineTo(x, 280); ctx.stroke(); ctx.restore(); }
    tickRow(gx, 240, gw, span, ts, C.sky, aS, {label: 'J1', prog: (lt - .3) * 1.5});
    text('first 16 real cycles · dashed = exact 1 ms grid   前 16 个真实周期 · 虚线 = 准确的 1 毫秒', 960, 312, {size: 20, color: C.dim, alpha: aS});
  }
  // histogram of every measured period
  const grow = eo(ramp(lt, b[0] + .3, b[0] + 2));
  if (aH > 0) {
    axes(gx, gy, gw + 20, gh - 20, {alpha: aH});
    for (let i = 0; i < n; i++) {
      const v = H0[i] / maxH, h = Math.max(v > 0 ? 3 : 0, Math.sqrt(v) * (gh - 60)) * grow, x = gx + 10 + i * gw / n;
      const lo = D.frame.lo + i * D.frame.w, tail = lo < 900 || lo >= 1100;
      const c = tail && lt > b[1] ? C.coral : C.sky;
      ctx.save(); ctx.globalAlpha *= aH; ctx.fillStyle = rgba(c, .85); ctx.fillRect(x, gy - h, gw / n - 4, h); ctx.restore();
    }
    [400, 600, 800, 1000, 1200, 1400].forEach(us => text(us + ' µs', gx + 10 + (us - D.frame.lo) / D.frame.w * gw / n, gy + 32, {size: 20, font: F.mono, color: C.dim, alpha: aH}));
    text('cycle length · 周期长度', gx + gw / 2, gy + 70, {size: 22, color: C.dim, alpha: aH});
    text('count (√ scale) 次数', gx + 20, gy - gh + 10, {size: 20, color: C.dim, align: 'left', alpha: aH});
    realTag(1560, 380, aH);
    if (D.frame.out) text(`+ ${D.frame.out} cycles off the chart  另有 ${D.frame.out} 个周期超出图表范围`, 1560, 490, {size: 20, color: C.coral, alpha: aH * ramp(lt, b[1], b[1] + .6)});
    text(`${D.frame.n} cycles · shortest ${D.frame.min_us} µs · longest ${D.frame.max_us} µs`, 1560, 420, {size: 20, font: F.mono, color: C.dim, align: 'center', alpha: aH * ramp(lt, b[1], b[1] + .6)});
    // spread
    const aSD = fade(lt, b[2]);
    const c0 = gx + 10 + (1000 - D.frame.lo) / D.frame.w * gw / n, sdw = D.frame.sd_us / D.frame.w * gw / n;
    brace(c0 - sdw, c0 + sdw, gy - gh + 40, `σ = ${D.frame.sd_us} µs (this run)`, C.coral, aSD, -1);
    text(`runs: σ = ${D.frame.sd_all_us.join(' / ')} µs`, 1560, 455, {size: 20, font: F.mono, color: C.coral, alpha: aSD});
    chip('master = ordinary Mac  主站是一台普通 Mac', 1450, 545, C.gold, eback(ramp(lt, b[3] + .2, b[3] + .8)) * aH, {size: 20});
    chip('real-time OS: smaller, never 0  实时系统：更小，但不为零', 1450, 600, C.mint, eback(ramp(lt, b[4] + .2, b[4] + .8)) * aH, {size: 20});
  }
  // J1 vs J2: one frame passes J1, then J2
  const aJ = fade(lt, b[5], b[8]);
  if (aJ > 0) {
    const k = ((lt - b[5]) % 2.2) / 2.2;
    lineDiagram({alpha: aJ, y: 330, mid: () => frameOnLine(k, 3, C.gold, aJ, 330)});
        ctx.save(); ctx.globalAlpha *= aJ; ctx.strokeStyle = C.line; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(460, 600); ctx.lineTo(1460, 600); ctx.stroke(); ctx.restore();
    tickRow(460, 560, 1000, 1250, [100], C.sky, aJ, {label: 'J1'});
    tickRow(460, 640, 1000, 1250, [100 + D.frame.skew_ns], C.violet, aJ, {label: 'J2'});
    brace(460 + 100 / 1250 * 1000, 460 + (100 + D.frame.skew_ns) / 1250 * 1000, 700, `${D.frame.skew_ns} ns, every cycle  每个周期都一样`, C.gold, aJ * ramp(lt, b[5] + .8, b[5] + 1.4), 1);
    simTag(1560, 600, aJ * ramp(lt, b[6], b[6] + .6));
    text('= simulated cable 5 ns + chip 305 ns (ET1100 datasheet)  模拟：网线 + 芯片延迟（取自 ET1100 数据手册）', 960, 815, {size: 20, color: C.violet, alpha: aJ * ramp(lt, b[6], b[6] + .6)});
    chip('→ Episode 3  第 3 集', 1560, 680, C.mint, eback(ramp(lt, b[7] + .2, b[7] + .8)) * aJ, {size: 20});
  }
  // jitter goes to the motors
  const aM = fade(lt, b[8]);
  if (aM > 0) {
    const px = 620, py = 640, L = 360, th = 40 * DEG, lag = 6 * DEG * ramp(lt, b[8] + .8, b[8] + 1.8);
    arm(px, py, L, th, {ghost: true, color: C.gold, alpha: aM, mass: 16});
    arm(px, py, L, th - lag, {color: C.sky, alpha: aM, mass: 16, lw: 14});
    arcArrow(px, py, L + 40, th - lag, th, C.coral, {alpha: aM * ramp(lt, b[8] + 1, b[8] + 1.6), lw: 5});
    text('angle exaggerated  角度放大示意', px + 160, py + 50, {size: 20, color: C.dim, alpha: aM});
    const aC = ramp(lt, b[9] + .2, b[9] + 1);
    eq([['180°/s', C.sky], [' × ', C.dim], ['0.2 ms', C.coral], [' = ', C.dim], ['0.036°', C.coral]], 1340, 420, 50, {alpha: aC, glow: true});
    eq([['0.036°', C.coral], [' at 0.5 m ', C.dim], ['≈ 0.3 mm', C.coral]], 1340, 520, 44, {alpha: ramp(lt, b[9] + 1.5, b[9] + 2.3)});
    text('手臂末端约 0.3 毫米', 1340, 580, {size: 26, font: F.zh, color: C.dim, alpha: ramp(lt, b[9] + 1.5, b[9] + 2.3)});
  }
};

/* ---------- 7. what EtherCAT does instead ---------- */
function clockFace(x, y, r, t, color, a) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = C.panel; ctx.strokeStyle = color; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  const an = t * Math.PI * 2; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + r * .75 * Math.sin(an), y - r * .75 * Math.cos(an)); ctx.stroke();
  ctx.restore();
}
SCN.dc = (lt, b, d) => {
  const aL = fade(lt, .2, b[6]);
  const kF = lt > b[4] ? ((lt - b[4]) * .7) % 1 : -1, jF = .12 * Math.sin(Math.floor((lt - b[4]) * .7) * 2.3);
  lineDiagram({alpha: aL, y: 400, mid: () => { if (kF >= 0) frameOnLine(clamp(kF * 1.6 + jF, 0, .999), 3, C.coral, aL, 400); }});
  // clocks on every slave, all at the same phase
  const ph = ((lt - b[1]) * .7) % 1;
  [1, 2, 3].forEach(i => clockFace(LN.xs[i], 250, 34, ph, C.mint, aL * ramp(lt, b[1] + .2 + i * .25, b[1] + .8 + i * .25)));
  chip('Distributed Clock · DC  分布式时钟', 1160, 160 + 20, C.mint, eback(ramp(lt, b[2] + .2, b[2] + .8)) * aL, {size: 22});
  // SYNC0: every slave pulses together on the clock's tick
  if (lt > b[3] && lt < b[6]) {
    const k = ((lt - b[3]) * .7) % 1;
    [2, 3].forEach(i => pulse(LN.xs[i], 400, k * 2.2, C.mint));
    if (k < .12) text('SYNC0', 1360, 560, {size: 34, font: F.mono, weight: 700, color: C.mint, alpha: aL});
  }
  // frames from the wobbling master arrive at uneven times — but before SYNC0
  if (lt > b[4]) {
    chip('frame: any time before SYNC0  帧只要在 SYNC0 之前到', 960, 600, C.coral, eback(ramp(lt, b[4] + .3, b[4] + .9)) * aL, {size: 22});
  }
  chip('master still wobbles  主站照样在晃', LN.xs[0], 560, C.gold, eback(ramp(lt, b[5] + .2, b[5] + .8)) * aL, {size: 20});
  // the comparison: period spread, log scale
  const aC = fade(lt, b[6]);
  if (aC > 0) {
    realTag(1640, 250, aC);
    const x0 = 460, y1 = 340, y2 = 480, maxW = 1100, lg = v => Math.log10(v) / Math.log10(100000) * maxW; // 1 ns .. 100 µs
    const fsd = D.frame.sd_us * 1000, dsd = D.dc.sd_ns;
    const g1 = eo(ramp(lt, b[6] + .2, b[6] + 1.4)), g2 = eo(ramp(lt, b[6] + 1, b[6] + 2.2));
    text('act on frame', x0 - 30, y1 - 16, {size: 26, weight: 600, color: C.coral, align: 'right', alpha: aC});
    text('到达即动作', x0 - 30, y1 + 18, {size: 20, font: F.zh, color: C.dim, align: 'right', alpha: aC});
    text('SYNC0 (DC)', x0 - 30, y2 - 16, {size: 26, weight: 600, color: C.mint, align: 'right', alpha: aC});
    text('分布式时钟', x0 - 30, y2 + 18, {size: 20, font: F.zh, color: C.dim, align: 'right', alpha: aC});
    ctx.save(); ctx.globalAlpha *= aC;
    rr(x0, y1 - 30, lg(fsd) * g1, 60, 10); ctx.fillStyle = rgba(C.coral, .8); ctx.fill();
    rr(x0, y2 - 30, Math.max(8, lg(dsd)) * g2, 60, 10); ctx.fillStyle = rgba(C.mint, .9); ctx.fill();
    ctx.restore();
    text(`σ = ${D.frame.sd_us} µs`, x0 + lg(fsd) * g1 + 20, y1, {size: 30, font: F.mono, weight: 700, color: C.coral, align: 'left', alpha: aC * g1});
    text(`σ = ${D.dc.sd_ns} ns`, x0 + Math.max(8, lg(dsd)) * g2 + 20, y2, {size: 30, font: F.mono, weight: 700, color: C.mint, align: 'left', alpha: aC * g2});
    ['1 ns', '10 ns', '100 ns', '1 µs', '10 µs', '100 µs'].forEach((s, i) => { const x = x0 + i / 5 * maxW;
      ctx.save(); ctx.globalAlpha *= aC * .5; ctx.strokeStyle = C.line; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y1 - 60); ctx.lineTo(x, y2 + 50); ctx.stroke(); ctx.restore();
      text(s, x, y2 + 80, {size: 20, font: F.mono, color: C.dim, alpha: aC}); });
    text('period spread, log scale  周期离散（对数刻度）', x0 + maxW / 2, y2 + 118, {size: 22, color: C.dim, alpha: aC});
    chip(`J1 ↔ J2 once settled: ≤ ${D.dc.settled_skew_ns} ns  稳定后相差`, 700, 700, C.mint, eback(ramp(lt, b[7] + .2, b[7] + .8)) * aC, {size: 22});
    chip('≈ 10,000× tighter  收紧约一万倍', 1300, 700, C.gold, eback(ramp(lt, b[8] + .2, b[8] + .8)) * aC, {size: 26});
    simTag(1300, 770, aC * ramp(lt, b[9], b[9] + .6));
    text('settling speed: our chip model  稳定速度来自模拟芯片模型', 1300, 812, {size: 20, color: C.violet, alpha: aC * ramp(lt, b[9], b[9] + .6)});
  }
};

    panel(960, y, 1100, 96, {alpha: Math.min(1, a), edge: rgba(c, .7), lw: 2.5});

    text(en, 760, y - 14, {size: 32, weight: 600, align: 'left', alpha: Math.min(1, a)});
    text(zh, 760, y + 22, {size: 22, font: F.zh, color: C.dim, align: 'left', alpha: Math.min(1, a)});
    ctx.restore();
  });
};

/* ---------- 9. recap ---------- */
SCN.recap = (lt, b, d) => {
  const items = [
    ['timing error = position error', '时间误差就是位置误差：速度 × 时间', C.coral],
    ['skew ≠ jitter', '偏差在关节之间，抖动是节拍本身', C.gold],
    ['act on arrival → inherit jitter; a shared clock removes it', '收到就动作会继承抖动；共享时钟才能去掉它', C.mint],
  ];
  items.forEach(([en, zh, c], i) => {
    const a = eo(ramp(lt, b[i] + .2, b[i] + .8)), y = 330 + i * 150;
    if (a <= 0) return;
    panel(960, y, 1300, 120, {alpha: a, edge: rgba(c, .6)});
    text(String(i + 1).padStart(2, '0'), 380, y, {size: 30, font: F.mono, weight: 700, color: c, alpha: a});
    text(en, 450, y - 18, {size: 34, weight: 600, align: 'left', alpha: a});
    text(zh, 450, y + 24, {size: 24, font: F.zh, color: C.dim, align: 'left', alpha: a});
  });
};

/* ---------- 10. your turn ---------- */
SCN.turn = (lt, b, d) => {
  text('YOUR TURN  你来算', 960, 220, {size: 26, font: F.mono, weight: 700, color: C.gold, ls: 6, alpha: fade(lt, .2)});
  const a1 = fade(lt, b[0] + .2, b[3]);
  eq([['90°/s', C.sky], [' × ', C.dim], ['0.3 ms', C.coral], [' = ', C.dim], ['?', C.gold, 1 - ramp(lt, b[2], b[2] + .4)]], 960, 420, 72, {alpha: a1, glow: true});
  const a2 = ramp(lt, b[2], b[2] + .8) * (1 - ramp(lt, b[3] - .5, b[3]));
  eq([['90°/s', C.sky], [' × ', C.dim], ['0.0003 s', C.coral], [' = ', C.dim], ['0.027°', C.gold]], 960, 560, 60, {alpha: a2, glow: true});
  const a3 = fade(lt, b[3]);
  if (a3 > 0) {
    text('Next · 下一集', 960, 330, {size: 26, font: F.mono, weight: 700, color: C.dim, alpha: a3});
    text('One cable is already a ring', 960, 430, {size: 64, font: F.disp, weight: 700, alpha: a3});
    text('一根网线就是一个环', 960, 510, {size: 34, font: F.zh, color: C.dim, alpha: a3});
    // a cable that is secretly two lanes
    ctx.save(); ctx.globalAlpha *= a3; ctx.lineCap = 'round';
    ctx.strokeStyle = C.gold; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(560, 620); ctx.lineTo(1360, 620); ctx.stroke();
    ctx.strokeStyle = C.sky; ctx.beginPath(); ctx.moveTo(560, 650); ctx.lineTo(1360, 650); ctx.stroke(); ctx.restore();
    arrow({x: 900, y: 620}, {x: 1000, y: 620}, C.gold, {alpha: a3}); arrow({x: 1000, y: 650}, {x: 900, y: 650}, C.sky, {alpha: a3});
  }
};

// filled by build.py with every Chinese character in this file (so the font subset loads them)
const EXTRA_ZH = '、一万上下不个中为主久么之乐了些享什从代令件会但位作你倍偏共关册准出分到刻前动卡即去发取另只台各同后听启周命哪器四回围图在型处多大它定实对小少就差布帧床应底度延式待很总意懂手才承抖拍拟指挥据掉收放散数断时是晃晚普曲更有期末本机条来标样根模次步段每毫没治添照片环理的目相真码确磕示离秒稳站端第等算米精系紧约纳线绊给统继网置能臂自节芯范虚行表要角误读谁走起超身软边达运进迟通速都采钟长问间队际集零题驱齐（），：；？';
/* =========================================================
   Chrome: chapter title, progress, subtitles
   ========================================================= */
var NOSUBS = location.search.includes('nosubs');
function chrome(t, si, s, lt){
  const n = TL.scenes.length;
  if (si > 0 && si < n-1){
    const a = eo(ramp(lt, .2, .8)) * (1 - ramp(lt, s.dur - .5, s.dur - .1));
    text(String(si).padStart(2,'0'), 80, 88, {size:26, font:F.mono, weight:700, color:C.gold, align:'left', alpha:a});
    text(s.title, 130, 88, {size:40, font:F.disp, weight:700, align:'left', alpha:a});
    text(s.zh, 132, 132, {size:22, font:F.zh, weight:500, color:C.dim, align:'left', alpha:a});
  }
  // progress ticks
  const bw = 34, gap = 8, x0 = W - 80 - n*bw - (n-1)*gap;
  for (let i=0;i<n;i++){ const x = x0 + i*(bw+gap); rr(x, 84, bw, 5, 2.5); ctx.fillStyle = rgba(C.faint,.9); ctx.fill();
    const f = i < si ? 1 : i > si ? 0 : clamp(lt/s.dur,0,1); if (f > 0){ rr(x, 84, bw*f, 5, 2.5); ctx.fillStyle = C.gold; ctx.fill(); } }
  // subtitles (off with ?nosubs: slides.mjs puts the narration beside each slide instead)
  const bt = !NOSUBS && s.beats.find(bb => lt >= bb.start - .05 && lt < bb.start + bb.dur + .35);
  if (bt){
    const a = ramp(lt, bt.start - .05, bt.start + .12) * (1 - ramp(lt, bt.start + bt.dur + .2, bt.start + bt.dur + .35));
    const g = ctx.createLinearGradient(0, 840, 0, H); g.addColorStop(0,'rgba(7,11,22,0)'); g.addColorStop(1,'rgba(7,11,22,.85)'); ctx.fillStyle = g; ctx.fillRect(0, 840, W, H-840);
    ctx.font = `500 38px ${F.sans}`; const lines = wrapLines(bt.text, 1500);
    const zy = 1030, ly = zy - 52 - (lines.length-1)*50;
    lines.forEach((l,i) => text(l, 960, ly + i*50, {size:38, weight:500, alpha:a, shadow:'rgba(0,0,0,.8)'}));
    text(bt.zh, 960, zy, {size:27, font:F.zh, weight:500, color:'#B9C1D3', alpha:a});
  }
}

/* =========================================================
   render(t)
   ========================================================= */
var render = function(t){
  ctx.setTransform(1,0,0,1,0,0);
  background(t);
  const sc = TL.scenes; let si = sc.findIndex(s => t >= s.start && t < s.start + s.dur); if (si < 0) si = t < 0 ? 0 : sc.length-1;
  const s = sc[si], lt = t - s.start, b = s.beats.map(x => x.start);
  const a = Math.min(ramp(lt, 0, .5), 1 - ramp(lt, s.dur - .45, s.dur));
  ctx.save(); ctx.globalAlpha = a;
  const z = 1 + .025*(1 - eo(ramp(lt, 0, 1.6))); ctx.translate(960,540); ctx.scale(z,z); ctx.translate(-960,-540);
  SCN[s.id](lt, b, s.dur);
  ctx.restore();
  chrome(t, si, s, lt);
  if (si === sc.length-1){ const k = ramp(lt, s.dur - 1.2, s.dur); if (k > 0){ ctx.fillStyle = `rgba(0,0,0,${k})`; ctx.fillRect(0,0,W,H); } }
};


var ready = (async () => {
  const zh = TL.scenes.map(s => s.zh + s.beats.map(b => b.zh).join('')).join('');
  try { await Promise.all([
    document.fonts.load(`700 150px ${F.disp}`), document.fonts.load(`600 40px ${F.disp}`),
    document.fonts.load(`500 38px ${F.sans}`), document.fonts.load(`600 38px ${F.sans}`),
    document.fonts.load(`700 24px ${F.mono}`), document.fonts.load(`500 24px ${F.mono}`),
    document.fonts.load(`500 27px ${F.zh}`, zh + EXTRA_ZH)]); await document.fonts.ready; } catch(e){}
  return true;
})();

/* ---------- player ---------- */
if (location.search.includes('record')){ document.body.classList.add('record'); ready.then(() => render(0)); }
else {
  const au = document.getElementById('au'), pp = document.getElementById('pp'), sc = document.getElementById('scrub'), tm = document.getElementById('tm');
  let playing = false, t0 = 0, base = 0, useAudio = true;
  const now = () => playing ? (useAudio && !au.paused ? au.currentTime : base + (performance.now() - t0)/1000) : base;
  const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  pp.onclick = () => {
    if (playing){ base = now(); playing = false; au.pause(); pp.textContent = 'Play'; }
    else { if (base >= TL.total) base = 0; playing = true; t0 = performance.now(); au.currentTime = base; au.play().catch(() => { useAudio = false; }); pp.textContent = 'Pause'; }
  };
  sc.oninput = () => { base = sc.value/1000*TL.total; t0 = performance.now(); au.currentTime = base; };
  const loop = () => { let t = now(); if (t >= TL.total){ t = TL.total - .001; if (playing){ playing = false; base = TL.total; pp.textContent = 'Replay'; } } render(t); sc.value = Math.round(t/TL.total*1000); tm.textContent = `${fmt(t)} / ${fmt(TL.total)}`; requestAnimationFrame(loop); };
  ready.then(() => { render(0); loop(); });
}
</script>
