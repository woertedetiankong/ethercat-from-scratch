  ctx.save(); ctx.globalAlpha *= (o.alpha ?? 1);
  ctx.font = `${o.weight||500} ${o.size||28}px ${o.font||F.sans}`;
  ctx.fillStyle = o.color || C.ink; ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'middle';
  if (o.ls) ctx.letterSpacing = o.ls + 'px';
  if (o.shadow){ ctx.shadowColor = o.shadow; ctx.shadowBlur = 24; }
  ctx.fillText(s,x,y); ctx.restore();
}
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }
function glow(x,y,r,color,a=1){ const g = ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0, rgba(color,.5*a)); g.addColorStop(1, rgba(color,0)); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
function dot(x,y,r,color,a=1){ ctx.save(); ctx.globalAlpha *= a; glow(x,y,r*3.6,color,.9); ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.restore(); }
function qpt(a,b,bend,t){ const mx=(a.x+b.x)/2, my=(a.y+b.y)/2, dx=b.x-a.x, dy=b.y-a.y, cx=mx-dy*bend, cy=my+dx*bend, u=1-t; return {x:u*u*a.x+2*u*t*cx+t*t*b.x, y:u*u*a.y+2*u*t*cy+t*t*b.y}; }
function packet(a,b,p,color,o={}){
  if (p <= 0 || p >= 1) return null;
  const r = o.r || 9, bend = o.bend || 0;
  ctx.save();
  for (let i=10;i>=1;i--){ const q = qpt(a,b,bend,Math.max(0,p - .012*i)); ctx.globalAlpha = .045*(11-i); ctx.fillStyle = color; ctx.beginPath(); ctx.arc(q.x,q.y,r*(1-i*.06),0,Math.PI*2); ctx.fill(); }
  ctx.restore();
  const q = qpt(a,b,bend,p);
  if (o.shape === 'sq'){ ctx.save(); glow(q.x,q.y,r*3.4,color); ctx.fillStyle = color; rr(q.x-r,q.y-r,2*r,2*r,3); ctx.fill(); ctx.restore(); }
  else dot(q.x,q.y,r,color);
  if (o.label) text(o.label, q.x, q.y - r - 22, {size:o.ls||24, font:F.mono, weight:700, color});
  return q;
}
function burst(x,y,k,color=C.red){ // k in 0..1
  if (k <= 0 || k >= 1) return;
  ctx.save(); ctx.globalAlpha *= 1-k;
  ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x,y,14+60*eo(k),0,Math.PI*2); ctx.stroke();
  const s = 16; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x-s,y-s); ctx.lineTo(x+s,y+s); ctx.moveTo(x+s,y-s); ctx.lineTo(x-s,y+s); ctx.stroke();
  ctx.restore();
}
function cross(x,y,s,color,lw=7,a=1){ ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x-s,y-s); ctx.lineTo(x+s,y+s); ctx.moveTo(x+s,y-s); ctx.lineTo(x-s,y+s); ctx.stroke(); ctx.restore(); }
function check(x,y,s,color,a=1){ ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = color; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(x-s,y); ctx.lineTo(x-s*.3,y+s*.7); ctx.lineTo(x+s,y-s*.6); ctx.stroke(); ctx.restore(); }
function ringArc(x,y,r,frac,color,lw=6,a=1){ ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = rgba(color,.18); ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke(); ctx.strokeStyle = color; ctx.lineCap='round'; ctx.beginPath(); ctx.arc(x,y,r,-Math.PI/2,-Math.PI/2 + Math.PI*2*clamp(frac,0,1)); ctx.stroke(); ctx.restore(); }
function pulse(x,y,k,color,r0=40,r1=120){ if (k<=0||k>=1) return; ctx.save(); ctx.globalAlpha *= (1-k); ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(x,y,lerp(r0,r1,eo(k)),0,Math.PI*2); ctx.stroke(); ctx.restore(); }
function tag(s,x,y,color,o={}){
  ctx.save(); ctx.globalAlpha *= (o.alpha ?? 1);
  ctx.font = `700 ${o.size||22}px ${F.mono}`; const w = ctx.measureText(s).width + 28, h = (o.size||22) + 18;
  rr(x-w/2, y-h/2, w, h, h/2); ctx.fillStyle = rgba(color,.16); ctx.fill(); ctx.strokeStyle = rgba(color,.7); ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s,x,y+1); ctx.restore();
}
function server(x,y,w,h,o={}){
  const st = o.state || 'ok', a = o.alpha ?? 1;
  const edge = st==='dead' ? C.red : st==='hot' ? C.coral : o.edge || C.sky;
  ctx.save(); ctx.globalAlpha *= a;
  if (st !== 'dead') glow(x,y,Math.max(w,h)*.9, edge, st==='hot'?.35:.18);
  const g = ctx.createLinearGradient(0,y-h/2,0,y+h/2); g.addColorStop(0, st==='dead'?'#2A1822':C.panel2); g.addColorStop(1, st==='dead'?'#1A1018':C.panel);
  rr(x-w/2,y-h/2,w,h,14); ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = rgba(edge, st==='dead'?.8:.75); ctx.stroke();
  const rows = o.rows ?? 3, pad = 16, rh = (h - pad*2) / rows;
  for (let i=0;i<rows;i++){
    const ry = y - h/2 + pad + rh*i + rh/2;
    rr(x-w/2+pad, ry-rh*.32, w-pad*2, rh*.64, 6); ctx.fillStyle = 'rgba(255,255,255,.035)'; ctx.fill();
    const on = st==='dead' ? .12 : .35 + .65*(rnd(Math.floor((o.t||0)*6)+i*17+(o.seed||0))>.4 ? 1 : .3);
    ctx.fillStyle = rgba(st==='dead'?C.red:(o.led||C.mint), on); ctx.beginPath(); ctx.arc(x+w/2-pad-12, ry, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = rgba(C.dim, .35); for (let k=0;k<3;k++) ctx.fillRect(x-w/2+pad+14+k*16, ry-2, 9, 4);
  }
  if (o.prog != null && o.prog > 0){ rr(x-w/2+pad, y+h/2-12, (w-pad*2)*o.prog, 5, 2.5); ctx.fillStyle = C.gold; ctx.fill(); }
  ctx.restore();
  if (o.label) text(o.label, x, y + h/2 + 28, {size:o.lsize||24, font:F.mono, weight:500, color:st==='dead'?C.red:C.dim, alpha:a});
  if (st === 'dead') cross(x, y, Math.min(w,h)*.22, C.red, 9, a*.9);
}
function user(x,y,a=1,color=C.dim){
  ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x,y-16,15,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x,y+26,27,Math.PI,0); ctx.fill(); ctx.restore();
}
function hexagon(x,y,r,a=1){
  ctx.save(); ctx.globalAlpha *= a; glow(x,y,r*2.2,C.gold,.3);
  ctx.beginPath(); for (let i=0;i<6;i++){ const an = Math.PI/6 + i*Math.PI/3; const px = x + r*Math.cos(an), py = y + r*Math.sin(an); i ? ctx.lineTo(px,py) : ctx.moveTo(px,py); } ctx.closePath();
  ctx.fillStyle = C.panel2; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = C.gold; ctx.stroke();
  ctx.strokeStyle = rgba(C.gold,.8); ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (let i=-1;i<=1;i++){ ctx.beginPath(); ctx.moveTo(x-r*.35, y); ctx.lineTo(x+r*.35, y+i*r*.35); ctx.stroke(); }
  ctx.restore();
}
function nodeCircle(x,y,r,o={}){
  const role = o.role || 'follower', a = o.alpha ?? 1;
  const col = role==='leader' ? C.gold : role==='candidate' ? C.coral : role==='dead' ? C.red : C.sky;
  ctx.save(); ctx.globalAlpha *= a;
  if (role !== 'dead') glow(x,y,r*2.1,col, role==='follower'?.25:.55);
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle = role==='dead' ? '#241722' : role==='leader' ? mixHex(C.panel2,C.gold,.22) : C.panel2; ctx.fill();
  ctx.lineWidth = role==='follower' ? 3 : 5; ctx.strokeStyle = rgba(col, role==='dead'?.6:1); ctx.stroke();
  ctx.restore();
  text(o.name, x, y-6, {size:34, font:F.mono, weight:700, color: role==='dead'?C.faint:C.ink, alpha:a});
  if (o.sub) text(o.sub, x, y+24, {size:18, font:F.mono, weight:500, color:C.dim, alpha:a});
  if (role === 'leader'){ // crown
    ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = C.gold; const cy = y - r - 26, s = 22;
    ctx.beginPath(); ctx.moveTo(x-s,cy+10); ctx.lineTo(x-s,cy-6); ctx.lineTo(x-s*.5,cy+2); ctx.lineTo(x,cy-12); ctx.lineTo(x+s*.5,cy+2); ctx.lineTo(x+s,cy-6); ctx.lineTo(x+s,cy+10); ctx.closePath(); ctx.fill(); ctx.restore();
  }
  if (role === 'dead') cross(x,y,r*.55,C.red,8,a*.9);
}
function wrapLines(s, maxW){ const words = s.split(' '), out = []; let cur = ''; for (const w of words){ const t = cur ? cur+' '+w : w; if (ctx.measureText(t).width > maxW && cur){ out.push(cur); cur = w; } else cur = t; } if (cur) out.push(cur); return out; }

/* ---------- background ---------- */
function background(t){
  ctx.fillStyle = C.bg; ctx.fillRect(0,0,W,H);
  const g = ctx.createRadialGradient(960,480,80,960,480,1150); g.addColorStop(0, C.bg2); g.addColorStop(1, rgba(C.bg,0)); ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = rgba(C.faint,.35); const off = (t*6)%48;
  for (let x = 24; x < W; x += 48) for (let y = 24 + off; y < H; y += 48) ctx.fillRect(x, y, 2, 2);
  const v = ctx.createRadialGradient(960,540,500,960,540,1250); v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.55)'); ctx.fillStyle = v; ctx.fillRect(0,0,W,H);
}

/* ---------- more primitives: panels, files, disks, arrows, chips ---------- */
function panel(x,y,w,h,o={}){ ctx.save(); ctx.globalAlpha *= (o.alpha ?? 1); rr(x-w/2,y-h/2,w,h,o.r||14); ctx.fillStyle = o.fill || C.panel; ctx.fill(); ctx.lineWidth = o.lw || 2; ctx.strokeStyle = o.edge || C.line; if (o.dash) ctx.setLineDash(o.dash); ctx.stroke(); ctx.restore(); }
function fileIcon(x,y,w,h,o={}){
  const a = o.alpha ?? 1, c = o.color || C.sky, f = Math.min(18, w*.22);
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; if (o.glow) glow(x,y,Math.max(w,h)*.9,c,o.glow);
  ctx.beginPath(); ctx.moveTo(x-w/2,y-h/2); ctx.lineTo(x+w/2-f,y-h/2); ctx.lineTo(x+w/2,y-h/2+f); ctx.lineTo(x+w/2,y+h/2); ctx.lineTo(x-w/2,y+h/2); ctx.closePath();
  ctx.fillStyle = o.fill || C.panel2; ctx.fill(); if (o.dash) ctx.setLineDash(o.dash); ctx.strokeStyle = c; ctx.lineWidth = o.lw || 2.5; ctx.stroke(); ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x+w/2-f,y-h/2); ctx.lineTo(x+w/2-f,y-h/2+f); ctx.lineTo(x+w/2,y-h/2+f); ctx.stroke();
  if (o.rows){ const n = o.rows, rh = Math.min(30, (h-36)/Math.max(n,1)); for (let k=0;k<n;k++){ const ry = y - h/2 + 22 + k*rh + rh/2, rc = o.rowColors ? o.rowColors[k] : c; rr(x-w/2+16, ry-rh*.22, (w-40)*(.55 + .4*rnd(k*7+(o.seed||0))), rh*.44, 4); ctx.fillStyle = rgba(rc,.75); ctx.fill(); } }
  ctx.restore();
  if (o.label) text(o.label, x, y + (o.ly || 0), {size:o.size||20, font:F.mono, weight:700, color:o.tcolor||c, alpha:a});
}
function cylinder(x,y,w,h,o={}){
  const a = o.alpha ?? 1, c = o.color || C.sky, e = w*.16; if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; if (o.glow !== 0) glow(x,y,Math.max(w,h)*.85,c,o.glow ?? .2);
  ctx.beginPath(); ctx.moveTo(x-w/2,y-h/2); ctx.lineTo(x-w/2,y+h/2); ctx.ellipse(x,y+h/2,w/2,e,0,Math.PI,0,true); ctx.lineTo(x+w/2,y-h/2); ctx.closePath();
  ctx.fillStyle = C.panel2; ctx.fill(); ctx.strokeStyle = c; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(x,y-h/2,w/2,e,0,0,Math.PI*2); ctx.fillStyle = mixHex(C.panel2,c,.18); ctx.fill(); ctx.stroke();
  ctx.restore();
  if (o.inner) text(o.inner, x, y + e*.6, {size:o.isize||18, font:F.mono, weight:700, color:o.icolor||C.ink, alpha:a});
  if (o.label) text(o.label, x, y + h/2 + e + 26, {size:o.size||22, font:F.mono, weight:700, color:o.tcolor||C.dim, alpha:a});
}
function arrow(a,b,color,o={}){
  const p = o.p ?? 1, al = o.alpha ?? 1; if (p <= 0 || al <= 0) return;
  const x = lerp(a.x,b.x,p), y = lerp(a.y,b.y,p), an = Math.atan2(b.y-a.y, b.x-a.x), s = o.head || 14;
  ctx.save(); ctx.globalAlpha *= al; ctx.strokeStyle = color; ctx.lineWidth = o.lw || 3; ctx.lineCap = 'round'; if (o.dash) ctx.setLineDash(o.dash);
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(x - Math.cos(an)*s*.6, y - Math.sin(an)*s*.6); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x - s*Math.cos(an-.45), y - s*Math.sin(an-.45)); ctx.lineTo(x - s*Math.cos(an+.45), y - s*Math.sin(an+.45)); ctx.closePath(); ctx.fill(); ctx.restore();
}
function chip(s,x,y,c,k=1,o={}){ if (k <= 0) return; ctx.save(); ctx.translate(x,y); ctx.scale(k,k); tag(s,0,0,c,{size:o.size||20, alpha:o.alpha ?? 1}); ctx.restore(); }
function lockIcon(x,y,s,color,a=1){ ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = color; ctx.lineWidth = s*.16; ctx.beginPath(); ctx.arc(x, y - s*.15, s*.36, Math.PI, 0); ctx.stroke(); rr(x - s*.55, y - s*.15, s*1.1, s*.85, s*.14); ctx.fillStyle = color; ctx.fill(); ctx.restore(); }
// piecewise-linear map through [t, v] knots
function knots(t, ks){ if (t <= ks[0][0]) return ks[0][1]; for (let i=1;i<ks.length;i++) if (t <= ks[i][0]) return lerp(ks[i-1][1], ks[i][1], (t - ks[i-1][0])/(ks[i][0] - ks[i-1][0])); return ks[ks.length-1][1]; }

/* ---------- 3Blue1Brown-style primitives: formulas, joints, plots, gears, code ----------
   eq(parts,cx,y,size,{left,glow,alpha}) parts = [str, color, alpha?, sub?] — colour each symbol by meaning, fade terms in one at a time
   wipe(p,x,y,w,h,fn) reveals whatever fn draws left→right (the 'Write' feel); brace(x1,x2,y,label,color,a) a curly brace with a label
   arm/arcArrow/springArc (rotating links, torques, springs), axes/plot (graphs drawn progressively), gear, codeBox, label2 (English over Chinese)
   ------------------------------------------------------------------------------------------ */
const DEG = Math.PI / 180;
// math-ish font for formulas
const MF = (size, w = 600) => `italic ${w} ${size}px ${F.disp}`;
// parts: [string, color, alpha?, sub?]; drawn left→right, centred on cx (or left-aligned with o.left)
function eq(parts, cx, y, size, o = {}) {
  ctx.save(); ctx.globalAlpha *= (o.alpha ?? 1);
  const wOf = p => { ctx.font = MF(p[3] ? size * .55 : size); return ctx.measureText(p[0]).width; };
  const total = parts.reduce((s, p) => s + wOf(p), 0);
  let x = o.left ? cx : cx - total / 2;
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  for (const p of parts) {
    const w = wOf(p), a = p[2] ?? 1;
    if (a > 0) { ctx.save(); ctx.globalAlpha *= a; ctx.font = MF(p[3] ? size * .55 : size); ctx.fillStyle = p[1];
      if (o.glow && p[1] !== C.dim) { ctx.shadowColor = rgba(p[1], .55); ctx.shadowBlur = 18; }
      ctx.fillText(p[0], x, y + (p[3] ? size * .28 : 0)); ctx.restore(); }
    x += w;
  }
  ctx.restore(); return total;
}
// a joint: pivot at (px,py), link of length L at angle th (radians, CCW from +x, screen y up)
const tip = (px, py, L, th) => ({x: px + L * Math.cos(th), y: py - L * Math.sin(th)});
function arm(px, py, L, th, o = {}) {
  const a = o.alpha ?? 1; if (a <= 0) return;
  const e = tip(px, py, L, th), c = o.color || C.sky;
  ctx.save(); ctx.globalAlpha *= a; ctx.lineCap = 'round';
  if (o.ghost) { ctx.setLineDash([14, 14]); ctx.strokeStyle = rgba(c, .8); ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(e.x, e.y); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = c; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(e.x, e.y, o.mass || 22, 0, Math.PI * 2); ctx.stroke(); ctx.restore(); return; }
  glow((px + e.x) / 2, (py + e.y) / 2, L * .6, c, .25);
  ctx.strokeStyle = c; ctx.lineWidth = o.lw || 18; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(e.x, e.y); ctx.stroke();
  ctx.fillStyle = C.panel2; ctx.strokeStyle = C.ink; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(px, py, 24, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = o.massColor || C.ink; ctx.beginPath(); ctx.arc(e.x, e.y, o.mass || 22, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
// curved arrow along a circle of radius r from angle a0 to a1 (math angles)
function arcArrow(px, py, r, a0, a1, color, o = {}) {
  const al = o.alpha ?? 1; if (al <= 0 || Math.abs(a1 - a0) < .01) return;
  ctx.save(); ctx.globalAlpha *= al; ctx.strokeStyle = color; ctx.lineWidth = o.lw || 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(px, py, r, -a0, -a1, a1 > a0); ctx.stroke();
  const dir = Math.sign(a1 - a0), e = tip(px, py, r, a1), tan = -a1 - dir * Math.PI / 2, s = o.head || 20;
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(e.x + Math.cos(tan) * s * .2, e.y + Math.sin(tan) * s * .2);
  ctx.lineTo(e.x - Math.cos(tan - .5) * s, e.y - Math.sin(tan - .5) * s); ctx.lineTo(e.x - Math.cos(tan + .5) * s, e.y - Math.sin(tan + .5) * s); ctx.closePath(); ctx.fill();
  ctx.restore();
}
// coil spring drawn along an arc of radius r between angles a0 and a1
function springArc(px, py, r, a0, a1, color, o = {}) {
  const al = o.alpha ?? 1; if (al <= 0) return;
  const n = 120, coils = Math.max(4, Math.abs(a1 - a0) / DEG / 4), amp = o.amp || 16;
  ctx.save(); ctx.globalAlpha *= al; ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.beginPath();
  for (let i = 0; i <= n; i++) { const u = i / n, an = lerp(a0, a1, u), rad = r + amp * Math.sin(u * coils * Math.PI * 2) * Math.min(1, u * 8, (1 - u) * 8);
    const q = tip(px, py, rad, an); i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y); }
  ctx.stroke(); ctx.restore();
}
// axes with origin at (x, y0): width w, half-height h
function axes(x, y0, w, h, o = {}) {
  const a = o.alpha ?? 1; if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = C.dim; ctx.lineWidth = 2.5;
  arrow({x, y: y0 + (o.full ? h : 0)}, {x, y: y0 - h - 10}, C.dim, {lw: 2.5, head: 12});
  arrow({x: x - (o.both ? w : 0), y: y0}, {x: x + w + 10, y: y0}, C.dim, {lw: 2.5, head: 12});
  ctx.restore();
  if (o.xl) text(o.xl, x + w + 10, y0 + 34, {size: 24, font: F.mono, color: C.dim, align: 'right', alpha: a});
  if (o.yl) text(o.yl, x + 14, y0 - h - 10, {size: 26, font: F.mono, color: C.dim, align: 'left', alpha: a});
}
// plot fn(u) for u in [0, prog] mapped to x..x+w; value v ↦ y0 - v*k
function plot(fn, x, y0, w, k, prog, color, o = {}) {
  if (prog <= 0) return null;
  ctx.save(); ctx.globalAlpha *= (o.alpha ?? 1); ctx.strokeStyle = color; ctx.lineWidth = o.lw || 5; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.shadowColor = rgba(color, .6); ctx.shadowBlur = 14; ctx.beginPath();
  const n = 300; let q;
  for (let i = 0; i <= n * prog; i++) { const u = i / n; q = {x: x + u * w, y: y0 - fn(u) * k}; i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y); }
  ctx.stroke(); ctx.restore();
  return q;
}
function gear(x, y, r, teeth, rot, color, o = {}) {
  const a = o.alpha ?? 1; if (a <= 0) return;
  const depth = o.depth || 12, n = teeth * 4;
  ctx.save(); ctx.globalAlpha *= a; glow(x, y, r * 1.4, color, .25); ctx.beginPath();

/* ---------- 8. how SOEM sees it ---------- */
const dedent = ls => { const n = Math.min(...ls.filter(l => l.trim()).map(l => l.match(/^ */)[0].length)); return ls.map(l => l.slice(n)); };
function mini(x0, y, n, cutAfter, a, wkc, t) { // a small line and the counting read's counter riding on the frame
  const xs = [x0, x0 + 300, x0 + 560, x0 + 820];
  for (let i = 0; i < 3; i++) { if (cutAfter && i === cutAfter) { cross((xs[i] + xs[i + 1]) / 2, y, 12, C.coral, 5, a); continue; } line(xs[i] + 70, y, xs[i + 1] - 70, y, C.faint, 6, a * (i >= n ? .35 : 1)); }
  ['Master', 'Slave 1', 'J1', 'J2'].forEach((s, i) => { boxShape(xs[i], y, 140, 70, LCOL[i], a * (i > n ? .35 : 1)); text(s, xs[i], y, {size: 22, weight: 600, alpha: a * (i > n ? .35 : 1)}); });
  // t in 0..1: out to slave n and back; the counter is the value after each slave (real, from the trace)
  if (t <= 0 || t >= 1) return;
  const span = xs[n] - xs[0], pos = t < .5 ? t * 2 * span : (1 - t) * 2 * span, x = xs[0] + pos;
  const passed = t < .5 ? xs.slice(1, n + 1).filter(v => v <= x + 1).length : n;
  dot(x, y - 60, 12, t < .5 ? C.gold : C.sky, a);
  text(`counter ${wkc[passed]}`, x, y - 98, {size: 24, font: F.mono, weight: 700, color: C.gold, alpha: a});
}

/* ---------- 9. more than two ports (from the datasheet) ---------- */
SCN.tree = (lt, b, d) => {
  const N = {M: [260, 480], A: [660, 480], B: [1060, 350], C: [1460, 350], E: [1060, 620], F: [1460, 620]};
  const a = fade(lt, .2);
  const edges = [['M', 'A'], ['A', 'B'], ['B', 'C'], ['A', 'E'], ['E', 'F']];
  edges.forEach(([p, q]) => line(N[p][0], N[p][1], N[q][0], N[q][1], C.faint, 6, a));
  // the walk: main line first, back, then the branch, back, home (each port hands the frame to the next)
  const walk = ['M', 'A', 'B', 'C', 'B', 'A', 'E', 'F', 'E', 'A', 'M'];
  const segs = walk.slice(1).map((q, i) => [walk[i], q]);
  const u = lt > b[0] + 1.5 ? (((lt - b[0] - 1.5) / 7) % 1.15) : 0;
  if (u > 0 && u < 1) {
    const s = u * segs.length, i = Math.floor(s), f = s - i, [p, q] = segs[i];
    const dx = N[q][0] - N[p][0], dy = N[q][1] - N[p][1], L = Math.hypot(dx, dy), nx = -dy / L * 12, ny = dx / L * 12;
    const out = walk.indexOf(q) > walk.indexOf(p) && !(['B', 'A', 'E', 'M'].includes(q) && i >= 3 && (i === 3 || i === 4 || i === 7 || i === 8 || i === 9));
    // trail of finished segments
    ctx.save(); ctx.globalAlpha *= a * .6; ctx.lineWidth = 6; ctx.lineCap = 'round';
    for (let k = 0; k <= i; k++) { const [pp, qq] = segs[k], ddx = N[qq][0] - N[pp][0], ddy = N[qq][1] - N[pp][1], LL = Math.hypot(ddx, ddy), ox = -ddy / LL * 12, oy = ddx / LL * 12, ff = k < i ? 1 : f;
      const back = [3, 4, 7, 8, 9].includes(k); ctx.strokeStyle = back ? C.sky : C.gold;
      ctx.beginPath(); ctx.moveTo(N[pp][0] + ox, N[pp][1] + oy); ctx.lineTo(N[pp][0] + ox + ddx * ff, N[pp][1] + oy + ddy * ff); ctx.stroke(); }
    ctx.restore();
    const back = [3, 4, 7, 8, 9].includes(i);
    dot(N[p][0] + nx + dx * f, N[p][1] + ny + dy * f, 11, back ? C.sky : C.gold, a);
  }
  const lab = {M: ['Master', '主站', C.gold], A: ['3 ports', '3 个口', C.ink], B: ['', '', C.dim], C: ['', '', C.dim], E: ['branch', '支路', C.dim], F: ['', '', C.dim]};
  Object.entries(N).forEach(([k, [x, y]]) => { boxShape(x, y, 170, 90, lab[k][2], a); text(lab[k][0] || 'slave', x, y - 12, {size: 22, weight: 600, alpha: a}); text(lab[k][1] || '从站', x, y + 16, {size: 16, font: F.zh, color: C.dim, alpha: a}); });
  text('0', N.A[0] - 100, N.A[1] - 18, {size: 20, font: F.mono, weight: 700, color: C.dim, alpha: a});
  text('1', N.A[0] + 96, N.A[1] - 66, {size: 20, font: F.mono, weight: 700, color: C.dim, alpha: a});
  text('2', N.A[0] + 96, N.A[1] + 70, {size: 20, font: F.mono, weight: 700, color: C.dim, alpha: a});
  chip('from the ESC datasheet, not our line  按 ESC 数据手册，不是我们的总线', 960, 215, C.dim, eback(ramp(lt, .4, 1)), {size: 20});
  card(960, 775, 1100, 90, 'a tree is still one ring: every branch, in turn', '树形也还是一个环：每条支路挨个走', C.mint, fade(lt, b[1] + 1), {size: 32, tcolor: C.mint});
};

    text('?', 960, 600, {size: 90, font: F.disp, weight: 700, color: C.coral, alpha: fade(lt, b[1], b[2])});
    if (ans > 0) {
      ctx.save(); ctx.globalAlpha *= aL * ans; ctx.strokeStyle = C.coral; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(xs[3] + 60, y, 26, -Math.PI / 2, Math.PI / 2); ctx.stroke(); ctx.restore();
      text('port 1 closed  口 1 关闭', xs[3], y + 90, {size: 22, weight: 700, color: C.coral, alpha: aL * ans});
      chip('master finds 3  主站找到 3 个', xs[0] + 180, y + 160, C.mint, eback(ans), {size: 24});
    }
  }
  // the teaser: the head is home before the tail has left
  const aT = fade(lt, b[3]);
  if (aT > 0) {
    const x0 = 360, w = 1200, us = 6.5, sc = w / us, y = 420, rtt = D.scan.rtt[0] / 1000;
    const g = eo(ramp(lt, b[3] + .3, b[3] + 2.3));
    ctx.save(); ctx.globalAlpha *= aT; ctx.strokeStyle = C.line; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x0, y + 60); ctx.lineTo(x0 + w, y + 60); ctx.stroke(); ctx.restore();
    [0, 1, 2, 3, 4, 5, 6].forEach(t => text(t + ' µs', x0 + t * sc, y + 90, {size: 18, font: F.mono, color: C.dim, alpha: aT}));
    ctx.save(); ctx.globalAlpha *= aT; rr(x0, y - 26, D.wire_us * sc * g, 52, 8); ctx.fillStyle = rgba(C.gold, .75); ctx.fill(); ctx.restore();
    text(`shortest frame leaving the master: ${D.wire_us} µs at 100 Mbit/s  最短的帧发出去要 ${D.wire_us} 微秒`, x0 + D.wire_us * sc / 2, y - 60, {size: 22, color: C.gold, alpha: aT});
    const aH = ramp(lt, b[3] + 1, b[3] + 1.5);
    line(x0 + rtt * sc, y - 34, x0 + rtt * sc, y + 130, C.sky, 4, aT * aH);
    text(`head back home: ${rtt.toFixed(3)} µs  帧头已回家`, x0 + rtt * sc + 14, y + 140, {size: 24, weight: 700, color: C.sky, align: 'left', alpha: aT * aH});
    simTag(x0 + rtt * sc + 100, y + 180, aT * aH);
    const aN = fade(lt, b[4]);
    text('Next · 下一集', 960, 660, {size: 24, font: F.mono, weight: 700, color: C.dim, alpha: aN});
    text('One frame, never stopped: processing on the fly', 960, 720, {size: 46, font: F.disp, weight: 700, alpha: aN});
    text('一帧走到底：边走边处理', 960, 785, {size: 30, font: F.zh, color: C.dim, alpha: aN});
  }
};

// filled by build.py with every Chinese character in this file (so the font subset loads them)
const EXTRA_ZH = '一下不且两个中串主久么也了互些交什从们份会但作你信元全关内册写决几出列则到制剪加动单卡去双发变叠口另只合同后向和哪器回圆在处多大头存它完定实家寄对就尽居崩工己已帧广序底开形径微态总想懂我手才打扫找折拟按挨据掉接控描插撞播支收数整断方旁时是最有朝本束条来树样根模次死每比汇没溃片特状环理生用由电的相真着知短秒程站第约线经结给绞网置背胡自节芯行表要规计让许论读象走趟路身车转输边过运返还途通道那邻部都配采里闭集零需顺，：；？';
/* =========================================================
   Chrome: chapter title, progress, subtitles
   ========================================================= */
var NOSUBS = location.search.includes('nosubs');
function chrome(t, si, s, lt){
  const n = TL.scenes.length;
  if (si > 0 && si < n-1){
    const a = eo(ramp(lt, .2, .8)) * (1 - ramp(lt, s.dur - .5, s.dur - .1));
    text(String(si).padStart(2,'0'), 80, 88, {size:26, font:F.mono, weight:700, color:C.gold, align:'left', alpha:a});
    text(s.title, 130, 88, {size:40, font:F.disp, weight:700, align:'left', alpha:a});
    text(s.zh, 132, 132, {size:22, font:F.zh, weight:500, color:C.dim, align:'left', alpha:a});
  }
  // progress ticks
  const bw = 34, gap = 8, x0 = W - 80 - n*bw - (n-1)*gap;
  for (let i=0;i<n;i++){ const x = x0 + i*(bw+gap); rr(x, 84, bw, 5, 2.5); ctx.fillStyle = rgba(C.faint,.9); ctx.fill();
    const f = i < si ? 1 : i > si ? 0 : clamp(lt/s.dur,0,1); if (f > 0){ rr(x, 84, bw*f, 5, 2.5); ctx.fillStyle = C.gold; ctx.fill(); } }
  // subtitles (off with ?nosubs: slides.mjs puts the narration beside each slide instead)
  const bt = !NOSUBS && s.beats.find(bb => lt >= bb.start - .05 && lt < bb.start + bb.dur + .35);
  if (bt){
    const a = ramp(lt, bt.start - .05, bt.start + .12) * (1 - ramp(lt, bt.start + bt.dur + .2, bt.start + bt.dur + .35));
    const g = ctx.createLinearGradient(0, 840, 0, H); g.addColorStop(0,'rgba(7,11,22,0)'); g.addColorStop(1,'rgba(7,11,22,.85)'); ctx.fillStyle = g; ctx.fillRect(0, 840, W, H-840);
    ctx.font = `500 38px ${F.sans}`; const lines = wrapLines(bt.text, 1500);
    const zy = 1030, ly = zy - 52 - (lines.length-1)*50;
    lines.forEach((l,i) => text(l, 960, ly + i*50, {size:38, weight:500, alpha:a, shadow:'rgba(0,0,0,.8)'}));
    text(bt.zh, 960, zy, {size:27, font:F.zh, weight:500, color:'#B9C1D3', alpha:a});
  }
}

/* =========================================================
   render(t)
   ========================================================= */
var render = function(t){
  ctx.setTransform(1,0,0,1,0,0);
  background(t);
  const sc = TL.scenes; let si = sc.findIndex(s => t >= s.start && t < s.start + s.dur); if (si < 0) si = t < 0 ? 0 : sc.length-1;
  const s = sc[si], lt = t - s.start, b = s.beats.map(x => x.start);
  const a = Math.min(ramp(lt, 0, .5), 1 - ramp(lt, s.dur - .45, s.dur));
  ctx.save(); ctx.globalAlpha = a;
  const z = 1 + .025*(1 - eo(ramp(lt, 0, 1.6))); ctx.translate(960,540); ctx.scale(z,z); ctx.translate(-960,-540);
  SCN[s.id](lt, b, s.dur);
  ctx.restore();
  chrome(t, si, s, lt);
  if (si === sc.length-1){ const k = ramp(lt, s.dur - 1.2, s.dur); if (k > 0){ ctx.fillStyle = `rgba(0,0,0,${k})`; ctx.fillRect(0,0,W,H); } }
};


var ready = (async () => {
  const zh = TL.scenes.map(s => s.zh + s.beats.map(b => b.zh).join('')).join('');
  try { await Promise.all([
    document.fonts.load(`700 150px ${F.disp}`), document.fonts.load(`600 40px ${F.disp}`),
    document.fonts.load(`500 38px ${F.sans}`), document.fonts.load(`600 38px ${F.sans}`),
    document.fonts.load(`700 24px ${F.mono}`), document.fonts.load(`500 24px ${F.mono}`),
    document.fonts.load(`500 27px ${F.zh}`, zh + EXTRA_ZH)]); await document.fonts.ready; } catch(e){}
  return true;
})();

/* ---------- player ---------- */
if (location.search.includes('record')){ document.body.classList.add('record'); ready.then(() => render(0)); }
else {
  const au = document.getElementById('au'), pp = document.getElementById('pp'), sc = document.getElementById('scrub'), tm = document.getElementById('tm');
  let playing = false, t0 = 0, base = 0, useAudio = true;
  const now = () => playing ? (useAudio && !au.paused ? au.currentTime : base + (performance.now() - t0)/1000) : base;
  const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  pp.onclick = () => {
    if (playing){ base = now(); playing = false; au.pause(); pp.textContent = 'Play'; }
    else { if (base >= TL.total) base = 0; playing = true; t0 = performance.now(); au.currentTime = base; au.play().catch(() => { useAudio = false; }); pp.textContent = 'Pause'; }
  };
  sc.oninput = () => { base = sc.value/1000*TL.total; t0 = performance.now(); au.currentTime = base; };
  const loop = () => { let t = now(); if (t >= TL.total){ t = TL.total - .001; if (playing){ playing = false; base = TL.total; pp.textContent = 'Replay'; } } render(t); sc.value = Math.round(t/TL.total*1000); tm.textContent = `${fmt(t)} / ${fmt(TL.total)}`; requestAnimationFrame(loop); };
  ready.then(() => { render(0); loop(); });
}
</script>
