const DATA = {"total":456.329,"chapters":[{"id":"intro","n":0,"title":"Home before it has left","zh":"还没出门就到家了","t":0},{"id":"wire","n":1,"title":"A frame is a stream","zh":"帧是一串流动的比特","t":23.812},{"id":"switch","n":2,"title":"How an office switch does it","zh":"办公室交换机的做法","t":67.364},{"id":"fly","n":3,"title":"EtherCAT: never stored","zh":"EtherCAT：从不存下整帧","t":97.346},{"id":"tail","n":4,"title":"When is the whole frame back?","zh":"整帧什么时候回到主站？","t":141.768},{"id":"stretch","n":5,"title":"One frame across the whole line","zh":"一帧铺满整条总线","t":179.152},{"id":"seats","n":6,"title":"Every slave has its seats","zh":"每个从站都有自己的座位","t":214.548},{"id":"hops","n":7,"title":"One real frame, slave by slave","zh":"一帧真实的帧，一站一站看","t":251.008},{"id":"crc","n":8,"title":"The checksum comes last","zh":"校验和在最后","t":302.458},{"id":"scale","n":9,"title":"Why it matters","zh":"为什么这很重要","t":363.69},{"id":"recap","n":10,"title":"Recap","zh":"本集要点","t":394.738},{"id":"yourturn","n":11,"title":"Your turn","zh":"你来算","t":423.716}],"slides":[{"scene":"intro","ch":0,"title":"Home before it has left","zh":"还没出门就到家了","t":0.9,"lines":[["Last episode ended on a puzzle.","上一集留了一个谜题。"]],"img":"slides/001.jpg"},{"scene":"intro","ch":0,"title":"Home before it has left","zh":"还没出门就到家了","t":5.3,"lines":[["Our frame's first bit is back at the master after 1.5 µs.","我们这一帧的第一个比特，1.5 微秒就回到了主站。"],["But sending the whole frame takes 8 µs.","可整帧发出去要 8 微秒。"]],"img":"slides/002.jpg"},{"scene":"intro","ch":0,"title":"Home before it has left","zh":"还没出门就到家了","t":16.39,"lines":[["How can the head be home before the tail has even left?","帧头怎么能在帧尾出门之前就到家？"]],"img":"slides/003.jpg"},{"scene":"wire","ch":1,"title":"A frame is a stream","zh":"帧是一串流动的比特","t":24.71,"lines":[["On the cable, a frame is not a parcel. It is a stream of bits, one after another.","在网线上，帧不是一个包裹，而是一串接一串的比特。"]],"img":"slides/004.jpg"},{"scene":"wire","ch":1,"title":"A frame is a stream","zh":"帧是一串流动的比特","t":33.74,"lines":[["At 100 Mbit/s, one bit takes 10 ns. One byte takes 80 ns.","100 Mbit/s 下，一个比特 10 纳秒，一个字节 80 纳秒。"]],"img":"slides/005.jpg"},{"scene":"wire","ch":1,"title":"A frame is a stream","zh":"帧是一串流动的比特","t":40.59,"lines":[["Our cyclic frame is 88 bytes. With its preamble and checksum, 100 bytes go on the wire.","我们的周期帧 88 字节，加上前导码和校验和，线上一共 100 字节。"],["100 bytes × 80 ns = 8 µs, from the first bit to the last.","100 字节 × 80 纳秒 = 8 微秒，从第一个比特到最后一个。"]],"img":"slides/006.jpg"},{"scene":"wire","ch":1,"title":"A frame is a stream","zh":"帧是一串流动的比特","t":56.9,"lines":[["At 5 ns per metre, 8 µs of signal is 1.6 km long. Our whole line is 4 m.","按每米 5 纳秒算，8 微秒的信号有 1.6 公里长。我们整条总线才 4 米。"]],"img":"slides/007.jpg"},{"scene":"switch","ch":2,"title":"How an office switch does it","zh":"办公室交换机的做法","t":68.26,"lines":[["A typical office switch stores each frame before passing it on.","普通的办公室交换机，会先把整帧存下来，再往下传。"],["It waits for the last byte, checks the checksum, then starts sending.","它等最后一个字节到齐，核对校验和，然后才开始发送。"],["So every hop costs at least the whole frame time: 8 µs for our frame.","所以每过一站，至少要花整帧的时间：我们这一帧就是 8 微秒。"]],"img":"slides/008.jpg"},{"scene":"switch","ch":2,"title":"How an office switch does it","zh":"办公室交换机的做法","t":88.62,"lines":[["Like a post office that unpacks every parcel before sending it to the next town.","就像一个邮局，每个包裹都要拆开验过，才寄往下一个城市。"]],"img":"slides/009.jpg"},{"scene":"fly","ch":3,"title":"EtherCAT: never stored","zh":"EtherCAT：从不存下整帧","t":98.25,"lines":[["An EtherCAT slave chip does not store the frame.","EtherCAT 的从站芯片不存帧。"]],"img":"slides/010.jpg"},{"scene":"fly","ch":3,"title":"EtherCAT: never stored","zh":"EtherCAT：从不存下整帧","t":103.36,"lines":[["Its datasheet says it plainly: data is read and written as the bits pass.","它的数据手册说得很直白：比特经过时，数据就被读写。"]],"img":"slides/011.jpg"},{"scene":"fly","ch":3,"title":"EtherCAT: never stored","zh":"EtherCAT：从不存下整帧","t":110.65,"lines":[["The bits go in at port 0 and start leaving at port 1 about 305 ns later.","比特从口 0 进来，大约 305 纳秒后就开始从口 1 出去。"]],"img":"slides/012.jpg"},{"scene":"fly","ch":3,"title":"EtherCAT: never stored","zh":"EtherCAT：从不存下整帧","t":119.24,"lines":[["305 ns is about 4 bytes. That is all the chip holds at any moment.","305 纳秒大约是 4 个字节，芯片任何时刻手里就只有这么多。"]],"img":"slides/013.jpg"},{"scene":"fly","ch":3,"title":"EtherCAT: never stored","zh":"EtherCAT：从不存下整帧","t":126.96,"lines":[["Like a train that never stops: at each station, a worker takes off the letters for this town and puts its own letters on, while the train rolls through.","就像一列不停站的火车：每到一站，站上的人趁车开过，取下寄给本站的信，再塞上本站要寄的信。"]],"img":"slides/014.jpg"},{"scene":"tail","ch":4,"title":"When is the whole frame back?","zh":"整帧什么时候回到主站？","t":142.67,"lines":[["So, our 88-byte frame on our line.","那么，我们的 88 字节帧，在我们的总线上。"],["The head is back after 1485 ns. When has the last byte arrived?","帧头 1485 纳秒回来。最后一个字节什么时候到？"]],"img":"slides/015.jpg"},{"scene":"tail","ch":4,"title":"When is the whole frame back?","zh":"整帧什么时候回到主站？","t":156.29,"lines":[["The tail follows the head through every chip, 8 µs behind it.","帧尾跟着帧头穿过每一颗芯片，始终落后 8 微秒。"]],"img":"slides/016.jpg"},{"scene":"tail","ch":4,"title":"When is the whole frame back?","zh":"整帧什么时候回到主站？","t":162.71,"lines":[["1485 + 8000 = 9485 ns. The whole frame is back after about 9.5 µs.","1485 + 8000 = 9485 纳秒：整帧大约 9.5 微秒回到主站。"]],"img":"slides/017.jpg"},{"scene":"tail","ch":4,"title":"When is the whole frame back?","zh":"整帧什么时候回到主站？","t":170.43,"lines":[["The chip delays are simulated. The 80 ns per byte is the 100 Mbit/s standard.","芯片延迟是模拟的；每字节 80 纳秒是 100 Mbit/s 的标准。"]],"img":"slides/018.jpg"},{"scene":"stretch","ch":5,"title":"One frame across the whole line","zh":"一帧铺满整条总线","t":180.05,"lines":[["Freeze time at 1485 ns, the moment the head comes home.","把时间定格在 1485 纳秒，帧头回家的那一刻。"],["The master has sent only about 18 bytes so far. The rest is still waiting to go out.","主站这时才发出去大约 18 个字节，其余的还在排队等着出门。"],["Those 18 bytes are spread over the whole ring: every slave has a few bytes inside it.","这 18 个字节铺满了整个环：每个从站里都正有几个字节。"],["The master sends on one pair and receives on the other, at the same time. That is why this works.","主站一对线发、一对线收，同时进行。这一切能成立，靠的就是这一点。"]],"img":"slides/019.jpg"},{"scene":"seats","ch":6,"title":"Every slave has its seats","zh":"每个从站都有自己的座位","t":215.45,"lines":[["Inside the frame, the data area has a seat for each slave.","帧里的数据区，给每个从站都留了座位。"]],"img":"slides/020.jpg"},{"scene":"seats","ch":6,"title":"Every slave has its seats","zh":"每个从站都有自己的座位","t":221.87,"lines":[["SOEM printed where they are: 12 bytes going out, 28 bytes coming back.","SOEM 打印出了它们的位置：12 字节往外送，28 字节往回带。"]],"img":"slides/021.jpg"},{"scene":"seats","ch":6,"title":"Every slave has its seats","zh":"每个从站都有自己的座位","t":228.72,"lines":[["J1 and J2 each get 6 bytes of commands, and 6 bytes for their reply.","J1、J2 各有 6 字节的命令，再各有 6 字节写回答。"],["The analog card has no commands, just 16 bytes for its readings.","采集卡没有命令，只有 16 字节放它的读数。"],["How the seats are addressed is Episode 3b. Here, just watch them fill.","座位怎么寻址，是第 3 集下篇的内容。这里只看它们怎么被填上。"]],"img":"slides/022.jpg"},{"scene":"hops","ch":7,"title":"One real frame, slave by slave","zh":"一帧真实的帧，一站一站看","t":251.91,"lines":[["Here is one real frame from the run, copied after every slave.","这是运行中真实的一帧，每过一个从站就拍一张快照。"],["Leaving the master: new targets for J1 and J2. The reply seats still hold last cycle's values.","离开主站时：带着 J1、J2 的新目标；回答座位里还是上个周期的值。"],["After slave 1: the card has written its newest readings into its seats.","过了从站 1：采集卡把最新读数写进了自己的座位。"],["After J1: J1 has taken its target, and written its actual position in its own seat.","过了 J1：J1 取走了目标，把实际位置写进了自己的座位。"],["After J2: the same, in J2's seats.","过了 J2：J2 的座位也一样。"],["Back at the master: every seat is fresh. One frame, one trip, every slave served.","回到主站：每个座位都是新的。一帧，一趟，每个从站都服务到了。"]],"img":"slides/023.jpg"},{"scene":"hops","ch":7,"title":"One real frame, slave by slave","zh":"一帧真实的帧，一站一站看","t":294.07,"lines":[["Nothing waited for anything. Each slave did its part while the frame was passing.","没有谁在等谁。每个从站都是在帧经过的那一刻干完自己的事。"]],"img":"slides/024.jpg"},{"scene":"crc","ch":8,"title":"The checksum comes last","zh":"校验和在最后","t":303.36,"lines":[["One catch: every Ethernet frame ends with a checksum, proof that the bytes arrived intact.","有个难题：每个以太网帧末尾都有校验和，用来证明字节完好无损。"]],"img":"slides/025.jpg"},{"scene":"crc","ch":8,"title":"The checksum comes last","zh":"校验和在最后","t":311.08,"lines":[["A switch checks it before sending anything. The chip can't: by then, the front of the frame left long ago.","交换机先核对它，再往外发。芯片做不到：校验和到的时候，帧的前面早就走远了。"],["So the chip works out a new checksum as the bytes pass, and puts it at the end.","所以芯片边转发边算一个新的校验和，放在帧的末尾。"],["If the incoming checksum was wrong, it makes the outgoing one wrong too, and adds a marker.","如果收到的校验和是错的，它就让发出去的也错，再加一个标记。"],["It drops the changes this frame would have made in it, and counts an error.","它丢弃这一帧本来要在它身上生效的改动，并记一次错误。"]],"img":"slides/026.jpg"},{"scene":"crc","ch":8,"title":"The checksum comes last","zh":"校验和在最后","t":346.32,"lines":[["The master's network card throws the bad frame away. That cycle has no answer; the next one starts fresh.","主站的网卡把坏帧扔掉。这个周期没有回答，下一个周期重新开始。"],["This comes from the ESC datasheet. Our simulated line has no bit errors.","这部分来自 ESC 数据手册。我们模拟的总线不会出现比特错误。"]],"img":"slides/027.jpg"},{"scene":"scale","ch":9,"title":"Why it matters","zh":"为什么这很重要","t":364.59,"lines":[["Each slave adds about 0.3 µs, whatever the frame's length.","每个从站只添大约 0.3 微秒，跟帧多长无关。"],["Storing our frame would cost 8 µs per slave: about 26 times more.","如果要存下整帧，每个从站要 8 微秒：大约多 26 倍。"],["A full-size Ethernet frame takes about 122 µs to store. On the fly, still about 0.3 µs.","一个最大的以太网帧，存下来要约 122 微秒；边走边处理，还是约 0.3 微秒。"],["So one frame can serve a long line of slaves, every cycle, with time to spare.","所以一帧能在每个周期服务一长串从站，时间还绰绰有余。"]],"img":"slides/028.jpg"},{"scene":"recap","ch":10,"title":"Recap","zh":"本集要点","t":395.64,"lines":[["One: a frame is a stream. Ours is 8 µs long on the wire, far longer than the line.","一、帧是一串流：我们这一帧在线上长 8 微秒，比整条总线长得多。"],["Two: each slave reads and writes its seats as the bits pass, holding only a few bytes.","二、每个从站在比特经过时读写自己的座位，手里只留几个字节。"],["Three: the checksum can't be checked first, so a bad frame is marked and dropped at the end.","三、校验和没法先核对，所以坏帧在末尾被标记，最后被丢弃。"]],"img":"slides/029.jpg"},{"scene":"yourturn","ch":11,"title":"Your turn","zh":"你来算","t":424.62,"lines":[["Same line. This time the frame is 200 bytes on the wire.","还是这条总线，这次帧在线上有 200 字节。"],["The head is still back after 1485 ns. When has the whole frame arrived?","帧头仍然 1485 纳秒回来。整帧什么时候到齐？"],["200 × 80 ns = 16,000 ns. 1485 + 16,000 = 17,485 ns, about 17.5 µs.","200 × 80 纳秒 = 16000 纳秒。1485 + 16000 = 17485 纳秒，约 17.5 微秒。"]],"img":"slides/030.jpg"},{"scene":"yourturn","ch":11,"title":"Your turn","zh":"你来算","t":448.48,"lines":[["Next: what is inside the frame. Datagrams, logical addresses, and the working counter.","下一集：帧里装了什么。数据报、逻辑地址，还有工作计数器。"]],"img":"slides/031.jpg"}],"code":[],"practice":[{"scene":"tail","q":["我们的 88 字节周期帧，帧头 1485 纳秒回到主站。最后一个字节什么时候到？","Our 88-byte cyclic frame's head is back after 1485 ns. When has its last byte arrived?"],"a":["9485 纳秒，约 9.5 微秒。线上一共 100 字节（8 前导码 + 88 + 4 校验和），每字节 80 纳秒，帧尾比帧头晚 8000 纳秒。","After 9485 ns, about 9.5 µs. 100 bytes go on the wire (8 preamble + 88 + 4 checksum) at 80 ns each, so the tail is 8000 ns behind the head."],"why":["运行的 pcap 记录了每一帧发出和整帧收齐的时刻：每个 88 字节帧都是 9485 纳秒（data.py 逐帧检查）。芯片和网线延迟是模拟的，每字节 80 纳秒是 100 Mbit/s 的标准。","The run's pcap records when each frame left and when it was completely back: 9485 ns for every 88-byte frame (data.py checks each one). Chip and cable delays are simulated; 80 ns per byte is 100 Mbit/s."],"run":"episodes/ep03a-on-the-fly/data/runs.sh","t":141.768},{"scene":"stretch","q":["帧头回到主站的那一刻（1485 纳秒），主站已经发出去多少字节？它们在哪里？","At the moment the head comes home (1485 ns), how many bytes has the master sent, and where are they?"],"a":["约 18 字节（1485 ÷ 80 ≈ 18.6）。它们铺满了整个环：每个从站里都正有几个字节，其余 82 字节还在主站里排队。","About 18 (1485 ÷ 80 ≈ 18.6). They are spread around the whole ring, a few bytes inside every slave; the other 82 are still waiting in the master."],"why":["第 k 个字节在 k × 80 纳秒时出门，此后沿着和帧头一样的路径走。","Byte k leaves at k × 80 ns and then follows the same path as the head."],"reasoned":true,"t":179.152},{"scene":"hops","q":["一帧真实的周期帧经过 J1 之后，数据区里哪些字节变了？","After a real cyclic frame passes J1, which bytes of its data area have changed?"],"a":["只有 J1 自己的回答座位（数据区第 28–33 字节）：它写入了实际位置。J1 的命令座位只是被读取，别人的座位没动。","Only J1's own reply seats (bytes 28–33 of the data area), where it wrote its actual position. Its command seats were only read, and nobody else's seats changed."],"why":["运行里把同一帧在每个从站之后都复制了一份；data.py 检查每一站改动的字节都只落在它自己的座位里。","The run copies the same frame after every slave; data.py checks that the bytes each slave changes all fall in its own seats."],"run":"episodes/ep03a-on-the-fly/data/runs.sh","t":251.008},{"scene":"crc","q":["一个从站收到一帧，末尾的校验和是错的。它能把这一帧拦下来吗？它会怎么做？","A slave receives a frame whose checksum at the end is wrong. Can it stop the frame? What does it do?"],"a":["拦不下来：校验和到的时候，帧的前面早就发出去了。它让发出去的校验和也变成错的、加一个标记，丢弃这一帧本来要在它身上生效的改动，并记一次错误。主站网卡最后把坏帧扔掉。","No: by the time the checksum arrives, the front of the frame has already gone on. It makes the outgoing checksum wrong too and adds a marker, drops the changes this frame would have made in it, and counts an error. The master's network card throws the frame away."],"why":["ESC 数据手册第 I 部分第 14 节（错误计数器）。模拟总线没有比特错误，所以这一题没有运行数据。","ESC datasheet Section I, chapter 14 (error counters). Our simulated line has no bit errors, so no run backs this one."],"reasoned":true,"t":302.458},{"scene":"yourturn","q":["还是这条总线，帧在线上有 200 字节。帧头 1485 纳秒回来，整帧什么时候到齐？","Same line, a frame of 200 bytes on the wire. The head is back after 1485 ns. When has the whole frame arrived?"],"a":["1485 + 200 × 80 = 17485 纳秒，约 17.5 微秒。","1485 + 200 × 80 = 17,485 ns, about 17.5 µs."],"why":["帧尾比帧头晚 字节数 × 80 纳秒。","The tail is (bytes × 80 ns) behind the head."],"reasoned":true,"t":423.716},{"q":["如果每个从站都像交换机那样先存整帧再转发，我们这一帧每过一个从站要多花多少时间？","If every slave stored the whole frame before passing it on, like a switch, how much would each slave add for our frame?"],"a":["至少 8 微秒（整帧的线上时间），而边走边处理只要约 0.3 微秒，大约多 26 倍。","At least 8 µs (the frame's whole time on the wire), against about 0.3 µs on the fly: roughly 26 times more."],"why":["8000 ÷ 305 ≈ 26。存储转发必须等最后一个字节到齐。","8000 ÷ 305 ≈ 26. Store-and-forward has to wait for the last byte."],"reasoned":true}]};
const PRINT = location.search.includes('print');

<title>一帧走到底：边走边处理 课件</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F2F2F0; --tile:#FFFFFF; --soft:#F5F5F3; --soft-2:#FAFAF9; --edge:#E4E4E1; --edge-2:#D6D6D2;
  --ink:#141414; --ink-2:#3F3F46; --mute:#6E6E73; --faint:#A1A1A6;
  --acc:#4F46E5; --acc-soft:#EEF0FF;
  --f-sans:"Geist","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"Geist Mono","SFMono-Regular",Menlo,Consolas,"Noto Sans SC",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B0B0C; --tile:#161618; --soft:#1D1D20; --soft-2:#1A1A1D; --edge:#26262A; --edge-2:#34343A;
  --ink:#EDEDEF; --ink-2:#C9C9CF; --mute:#9A9AA2; --faint:#6B6B73; --acc:#8B85FF; --acc-soft:#22213A; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0B0B0C; --tile:#161618; --soft:#1D1D20; --soft-2:#1A1A1D; --edge:#26262A; --edge-2:#34343A;
  --ink:#EDEDEF; --ink-2:#C9C9CF; --mute:#9A9AA2; --faint:#6B6B73; --acc:#8B85FF; --acc-soft:#22213A; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 var(--f-sans); -webkit-font-smoothing:antialiased; overflow-wrap:anywhere}  /* long identifiers (CURRENT_CTL_CONFIG_PWM_DUTY_CYCLE_MAX) must not widen the page at phone width */
.wrap{max-width:1320px; margin:0 auto; padding-inline:20px; padding-block:36px 72px; display:flex; flex-direction:column; gap:28px}
h1,h2,h3{margin:0; text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--acc); outline-offset:2px}
a{color:inherit}

.hero{background:var(--tile); border:1px solid var(--edge); border-radius:22px; padding:28px 30px; display:flex; flex-direction:column; gap:12px}
.hero-top{display:flex; align-items:center; gap:10px; margin-bottom:4px}
.home{font:500 13px var(--f-sans); color:var(--mute); text-decoration:none; padding:6px 12px; border-radius:10px; background:var(--soft)}
.home:hover{color:var(--ink)}
.lang{margin-left:auto; display:inline-flex; padding:3px; gap:2px; border-radius:999px; background:var(--soft); border:0; cursor:pointer; font:600 12px/1 var(--f-mono); color:var(--mute)}
.lang span{padding:5px 9px; border-radius:999px}
.lang span.on{background:var(--ink); color:var(--bg)}
.eyebrow{font:500 13px var(--f-mono); color:var(--acc)}
h1{font-size:clamp(32px,4.4vw,52px); font-weight:600; letter-spacing:-.03em; line-height:1.08}
.lead{color:var(--ink-2); max-width:62ch}
.acts{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px}
.go{display:inline-flex; align-items:center; gap:6px; text-decoration:none; border-radius:12px; padding:9px 14px; font:500 14px var(--f-sans); background:var(--soft); color:var(--ink); border:0; cursor:pointer}
.go:hover{background:var(--edge)}
.go.main{background:var(--ink); color:var(--bg)}
.num{font-family:var(--f-mono); font-variant-numeric:tabular-nums}

.toc{position:sticky; top:0; z-index:2; display:flex; gap:6px; overflow-x:auto; padding:10px 0; background:var(--bg); scrollbar-width:thin}
.toc a{flex:none; text-decoration:none; font:500 13px var(--f-sans); color:var(--ink-2); background:var(--tile); border:1px solid var(--edge); border-radius:999px; padding:6px 12px; white-space:nowrap}
.toc a .num{color:var(--faint); margin-right:6px}
.toc a.on{background:var(--acc-soft); box-shadow:inset 0 0 0 1.5px var(--acc); border-color:transparent; color:var(--ink)}

.chap{display:flex; flex-direction:column; gap:14px; scroll-margin-top:64px}
.chap > header{display:flex; align-items:baseline; gap:12px; padding:8px 4px 0}
.chap > header .num{font-size:14px; color:var(--acc)}
.chap > header h2{font-size:24px; font-weight:600; letter-spacing:-.02em}
.chap > header small{color:var(--mute); font-size:14px}
.slide{display:grid; grid-template-columns:minmax(0,1.7fr) minmax(0,1fr); gap:0; background:var(--tile); border:1px solid var(--edge); border-radius:22px; overflow:hidden}
.slide img{display:block; width:100%; aspect-ratio:16/9; background:#070b16; cursor:zoom-in}
.notes{padding:20px 22px; display:flex; flex-direction:column; gap:12px}
.notes .meta{display:flex; gap:10px; align-items:center; font:500 12px var(--f-mono); color:var(--faint)}
.notes .meta a{color:var(--acc); text-decoration:none; background:var(--acc-soft); border-radius:8px; padding:3px 8px}
.line .a{color:var(--ink); font-size:15.5px}
.line .b{color:var(--mute); font-size:13.5px; margin-top:2px}
.zoom{position:fixed; inset:0; z-index:9; background:rgba(0,0,0,.88); display:flex; align-items:center; justify-content:center; padding:16px; cursor:zoom-out}
.zoom img{max-width:100%; max-height:100%; border-radius:8px}
/* code index + practice: the two pages that close the 课件 */
.extra{display:flex; flex-direction:column; gap:14px; scroll-margin-top:64px}
.extra > header{display:flex; align-items:baseline; gap:12px; padding:8px 4px 0; flex-wrap:wrap}
.extra > header h2{font-size:24px; font-weight:600; letter-spacing:-.02em}
.extra > header small{color:var(--mute); font-size:14px}
.tile{background:var(--tile); border:1px solid var(--edge); border-radius:22px; padding:8px 0; overflow-x:auto}
.cix{width:100%; border-collapse:collapse; font-size:14px}
.cix th{text-align:left; font:500 12px var(--f-mono); color:var(--faint); padding:10px 14px; border-bottom:1px solid var(--edge)}
.cix td{padding:10px 14px; border-bottom:1px solid var(--edge); vertical-align:top}
.cix tr:last-child td{border-bottom:0}
.cix .f{font-family:var(--f-mono); font-size:13px; color:var(--ink); word-break:break-all}
.cix .f b{font-weight:600}
.cix .fn{font-family:var(--f-mono); font-size:13px; color:var(--acc)}
.cix .where{color:var(--ink-2)} .cix .where small{display:block; color:var(--mute); font-size:12.5px}
.cix a{color:var(--acc); text-decoration:none; font-family:var(--f-mono); font-size:12.5px; background:var(--acc-soft); border-radius:8px; padding:2px 7px; white-space:nowrap; display:inline-block; margin:0 4px 4px 0}
.qs{display:flex; flex-direction:column; gap:12px}
.q{background:var(--tile); border:1px solid var(--edge); border-radius:22px; padding:20px 22px; display:flex; flex-direction:column; gap:10px}
.q .meta{display:flex; gap:8px; align-items:center; flex-wrap:wrap; font:500 12px var(--f-mono); color:var(--faint)}
.chip{font:500 12px var(--f-sans); border-radius:999px; padding:3px 9px; background:var(--soft); color:var(--ink-2)}
.chip.new{background:var(--acc-soft); color:var(--acc)}
.chip.reasoned{background:transparent; box-shadow:inset 0 0 0 1px var(--edge-2); color:var(--mute)}
.q .meta a{color:var(--acc); text-decoration:none; background:var(--acc-soft); border-radius:8px; padding:3px 8px}
.q .ask{font-size:16px; color:var(--ink)} .q .ask small{display:block; color:var(--mute); font-size:13.5px; margin-top:2px}
.q details{border-top:1px solid var(--edge); padding-top:10px}
.q summary{cursor:pointer; font:500 14px var(--f-sans); color:var(--acc); list-style:none} .q summary::-webkit-details-marker{display:none}
.q .ans{margin-top:8px; display:flex; flex-direction:column; gap:8px}
.q .ans .a{color:var(--ink)} .q .ans .b{color:var(--mute); font-size:13.5px}
.q .why{background:var(--soft); border-radius:14px; padding:10px 14px; font-size:14px; color:var(--ink-2)}
.q .why .lab{font:500 12px var(--f-mono); color:var(--faint); display:block; margin-bottom:2px}
.q code{font-family:var(--f-mono); font-size:12.5px; background:var(--soft-2); border:1px solid var(--edge); border-radius:6px; padding:1px 6px; word-break:break-all}
@media (max-width:760px){ .slide{grid-template-columns:1fr} .hero{padding:22px 20px}
  .cix thead{display:none} .cix tr{display:grid; grid-template-columns:28px minmax(0,1fr); column-gap:6px; padding:12px 14px; border-bottom:1px solid var(--edge)}
  .cix tr:last-child{border-bottom:0} .cix td{display:block; padding:0; border:0; grid-column:2} .cix td:first-child{grid-column:1; grid-row:1 / span 4}
  .cix .fn{word-break:break-all; margin-top:2px} .cix .where{margin-top:4px} }

/* Handout: one slide per A4 landscape page, notes in both languages (slides.mjs prints ?print to slides.pdf) */
@page{size:A4 landscape; margin:10mm}
@media print{
  body{background:#fff; color:#141414}
  .wrap{padding:0; gap:0; max-width:none}
  .hero,.toc,.chap > header,.zoom,.meta a{display:none!important}
  .chap{gap:0}
  .slide{grid-template-columns:1fr; border:0; border-radius:0; break-after:page; break-inside:avoid; height:189mm; align-content:start}
  .slide img{width:auto; height:auto; max-height:136mm; max-width:100%; margin:0 auto; border-radius:4px; cursor:auto}
  .notes{padding:4mm 2mm 0; gap:5px}
  .notes .meta{color:#6E6E73}
  .line .a{font-size:11pt; color:#141414} .line .b{font-size:9.5pt; color:#3F3F46}
  .extra{break-before:page; gap:4mm} .extra > header{display:flex!important; padding:0}
  .tile,.q{border:1px solid #D6D6D2; border-radius:8px; break-inside:avoid; background:#fff} .tile{overflow:visible}
  .cix{font-size:9pt} .cix td,.cix th{padding:4px 8px} .cix a{background:none; padding:0}
  .q{padding:4mm 5mm; gap:2mm} .q summary{display:none} .q .why{background:#F5F5F3}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="hero-top"><a class="home" id="homeLink" href="../../index.html#ep03a" hidden data-en="← Course home">← 课程首页</a><button class="lang" id="langBtn" type="button"></button></div>
    <p class="eyebrow" data-en="EtherCAT from Scratch · Episode 3 · Slides">EtherCAT 从零读懂 · 第 3 集 · 课件</p>
    <h1 data-en="One frame, never stopped: processing on the fly">一帧走到底：边走边处理</h1>
    <p class="lead" id="lead"></p>
    <div class="acts"><a class="go main" href="slides.pdf" download data-en="Download PDF">下载 PDF</a><button class="go" type="button" onclick="print()" data-en="Print">打印</button></div>
  </header>
  <nav class="toc" id="toc" aria-label="章节" data-en-label="Chapters"></nav>
  <main id="chapters" style="display:flex; flex-direction:column; gap:36px"></main>
  <section class="extra" id="code-index" hidden></section>
  <section class="extra" id="practice" hidden></section>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const mmss = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
if (EN) document.querySelectorAll('[data-en]').forEach(e => e.innerHTML = e.dataset.en);
if (EN) document.querySelectorAll('[data-en-label]').forEach(e => e.setAttribute('aria-label', e.dataset.enLabel));
if (EN) document.title = $('h1').textContent + ' · Slides';  // read from the DOM: a title may contain quotes
$('#langBtn').innerHTML = `<span class="${EN ? '' : 'on'}">中</span><span class="${EN ? 'on' : ''}">EN</span>`;
$('#langBtn').addEventListener('click', () => { try { localStorage.setItem('course.lang', EN ? 'zh' : 'en'); } catch {} location.reload(); });
// links back into the course site only work when served by it (not from the episode folder on file://)
const SITE = location.protocol !== 'file:';
$('#homeLink').hidden = !SITE;
$('#lead').textContent = L(`视频的 ${DATA.slides.length} 张截图，按章节排好，每张旁边是那一段的讲解（${mmss(DATA.total)} 视频）。点图片看大图，点时间从那里开始播放视频。`,
  `${DATA.slides.length} screenshots of the video, by chapter, each with the narration of that moment (${mmss(DATA.total)} of video). Click a picture to enlarge it, a time to play the video from there.`);
const title = c => PRINT ? `${c.zh} · ${c.title}` : L(c.zh, c.title);
const chaps = DATA.chapters.map(c => ({...c, slides: DATA.slides.filter(s => s.scene === c.id)})).filter(c => c.slides.length);
$('#toc').innerHTML = chaps.map(c => `<a href="#c-${esc(c.id)}"><span class="num">${String(c.n).padStart(2, '0')}</span>${esc(title(c))}</a>`).join('');
$('#chapters').innerHTML = chaps.map(c => `<section class="chap" id="c-${esc(c.id)}">
  <header><span class="num">${String(c.n).padStart(2, '0')}</span><h2>${esc(title(c))}</h2><small>${esc(EN ? c.zh : c.title)}</small></header>
  ${c.slides.map(s => `<article class="slide" id="s-${DATA.slides.indexOf(s) + 1}"><img src="${esc(s.img)}" alt="${esc(title(c))}" loading="${PRINT ? 'eager' : 'lazy'}">
    <div class="notes"><div class="meta"><span class="num">${String(DATA.slides.indexOf(s) + 1).padStart(3, '0')} · ${esc(title(c))}</span>${SITE ? `<a class="num" href="../../index.html#ep03a@${Math.floor(s.t)}">▶ ${mmss(s.t)}</a>` : `<span class="num">${mmss(s.t)}</span>`}</div>
      ${s.lines.map(([en, zh]) => `<div class="line"><div class="a">${esc(EN ? en : zh)}</div><div class="b">${esc(EN ? zh : en)}</div></div>`).join('')}</div></article>`).join('')}
</section>`).join('');
// in print (the PDF) labels carry both languages, like the slide notes
const L2 = (zh, en) => PRINT ? (zh && en ? `${zh} · ${en}` : zh || en) : L(zh, en);
// code index: every code pane of the video, in order of appearance
const chapOf = id => DATA.chapters.find(c => c.id === id);
const play = t => SITE ? `<a href="../../index.html#ep03a@${Math.floor(t)}">▶ ${mmss(t)}</a>` : `<span class="num">${mmss(t)}</span> `;
if (DATA.code && DATA.code.length) {
  const loc = c => { if (!c.file) return `<b>${esc(c.title)}</b>`; const i = c.file.lastIndexOf('/') + 1;
    return `${esc(c.file.slice(0, i))}<b>${esc(c.file.slice(i))}</b>${c.a ? ` · L${c.a}${c.b && c.b !== c.a ? '–' + c.b : ''}` : ''}`; };
  $('#code-index').hidden = false;
  $('#code-index').innerHTML = `<header><h2>${L2('代码索引', 'Code index')}</h2><small>${L2(`视频里出现的 ${DATA.code.length} 段源码，按出场顺序。对着文件和行号打开源码，就是视频里那几行。`, `The ${DATA.code.length} source excerpts shown in the video, in order of appearance. Open the file at these lines and you see exactly what the video showed.`)}</small></header>
  <div class="tile"><table class="cix"><thead><tr><th>#</th><th>${L2('文件 · 行', 'File · lines')}</th><th>${L2('函数', 'Function')}</th><th>${L2('出现在', 'Shown in')}</th><th>${L2('视频', 'Video')}</th></tr></thead><tbody>
  ${DATA.code.map((c, i) => { const ch = chapOf(c.scene); return `<tr><td class="num">${i + 1}</td><td class="f">${loc(c)}</td><td class="fn">${esc(c.fn || '')}</td>
    <td class="where">${esc(title(ch))}<small><a href="#s-${c.slide + 1}">${L2('课件', 'Slide')} ${String(c.slide + 1).padStart(3, '0')}</a></small></td>
    <td>${[c.t, ...c.again].map(play).join('')}</td></tr>`; }).join('')}
  </tbody></table></div>`;
}
// practice: the video's guess-first questions plus new ones, each with its answer and what it rests on
if (DATA.practice && DATA.practice.length) {
  const two = ([zh, en]) => PRINT ? `<div class="a">${esc(zh)}</div><div class="b">${esc(en)}</div>` : `<div class="a">${esc(L(zh, en))}</div><div class="b">${esc(EN ? zh : en)}</div>`;
  $('#practice').hidden = false;
  $('#practice').innerHTML = `<header><h2>${L2('练习', 'Practice')}</h2><small>${L2('先自己答，再看答案。每个答案都写了依据：源码行，或者真实运行。', 'Answer first, then open the answer. Each one says what it rests on: source lines or a real run.')}</small></header>
  <div class="qs">${DATA.practice.map((q, i) => `<article class="q">
    <div class="meta"><span class="num">${L2(`第 ${i + 1} 题`, `Q${i + 1}`)}</span><span class="chip ${q.scene ? '' : 'new'}">${q.scene ? L2('视频里的题', 'From the video') : L2('新题', 'New')}</span>${q.reasoned ? `<span class="chip reasoned">${L2('按代码推演', 'Worked out from the code')}</span>` : ''}${q.scene && q.t != null ? play(q.t) : ''}</div>
    <div class="ask">${PRINT ? `${esc(q.q[0])}<small>${esc(q.q[1])}</small>` : `${esc(L(q.q[0], q.q[1]))}<small>${esc(EN ? q.q[0] : q.q[1])}</small>`}</div>
    <details${PRINT ? ' open' : ''}><summary>${L2('看答案', 'Show answer')}</summary><div class="ans">${two(q.a)}
      <div class="why"><span class="lab">${L2('依据', 'Evidence')}</span>${esc(PRINT ? q.why[0] + ' / ' + q.why[1] : L(q.why[0], q.why[1]))}
      ${(q.src || []).length ? `<div style="margin-top:6px">${q.src.map(x => `<code>${esc(x)}</code>`).join(' ')}</div>` : ''}${q.run ? `<div style="margin-top:6px"><code>${esc(q.run)}</code></div>` : ''}</div></div></details>
  </article>`).join('')}</div>`;
}
$('#toc').insertAdjacentHTML('beforeend', (DATA.code && DATA.code.length ? `<a href="#code-index">${L('代码索引', 'Code index')}</a>` : '') + (DATA.practice && DATA.practice.length ? `<a href="#practice">${L('练习', 'Practice')}</a>` : ''));
document.addEventListener('click', e => {
  const img = e.target.closest('.slide img'); if (!img) return;
  const z = document.createElement('div'); z.className = 'zoom'; z.innerHTML = `<img src="${img.src}" alt="">`; z.onclick = () => z.remove(); document.body.append(z);
});
addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelector('.zoom')?.remove(); });
// highlight the chapter being read
const links = [...document.querySelectorAll('.toc a')];
const io = new IntersectionObserver(es => es.forEach(x => { if (!x.isIntersecting) return; links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + x.target.id)); }), {rootMargin: '-20% 0px -70% 0px'});
document.querySelectorAll('.chap, .extra').forEach(s => io.observe(s));
</script>
</body>
</html>
